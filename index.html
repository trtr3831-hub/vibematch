<html lang="tr">
<head>
<meta charset="utf-8">

<style>
  :root{--pembe:#ff2e88;--cyan:#00e5ff;--altin:#ffd166}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(circle at 20% 0%,#2a0f45 0,#0b0716 50%) #0b0716;color:#f5f3ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  .telefon{width:100%;max-width:400px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#0d0818}
  @media (min-width:500px){.telefon{height:min(860px,94dvh);margin-top:3dvh;border-radius:36px;border:1px solid #3b2a5c;box-shadow:0 0 0 8px #120a1f,0 0 70px rgba(255,46,136,.25)}}
  .neon{background:linear-gradient(90deg,var(--pembe),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .parla{box-shadow:0 0 18px rgba(255,46,136,.45)}
  .kaydir{overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .kaydir::-webkit-scrollbar{display:none}
  .giris{animation:giris .4s ease both}
  @keyframes giris{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .halka{padding:2.5px;border-radius:999px;background:linear-gradient(45deg,var(--altin),var(--pembe),#7c3aed)}
  .halka.goruldu{background:#3b2a5c}
  .cubuk{height:3px;background:#ffffff40;border-radius:9px;overflow:hidden}
  .cubuk>i{display:block;height:100%;width:0;background:#fff}
  .eq{display:flex;align-items:flex-end;gap:2px;height:16px}
  .eq span{width:3px;height:4px;background:var(--cyan);border-radius:2px}
  .eq.cal span{animation:eq .9s ease-in-out infinite}
  .eq.cal span:nth-child(2){animation-delay:.2s}
  .eq.cal span:nth-child(3){animation-delay:.4s}
  .eq.cal span:nth-child(4){animation-delay:.1s}
  @keyframes eq{0%,100%{height:4px}50%{height:16px}}
  .sekme[aria-current="true"]{color:var(--cyan);text-shadow:0 0 10px rgba(0,229,255,.7)}
  .sekme[aria-current="true"] .ikon{transform:translateY(-2px) scale(1.15)}
  .ikon{transition:transform .2s}
  .cip{border:1px solid #ffffff26;border-radius:999px;padding:4px 10px;font-size:12px;background:#ffffff0d;white-space:nowrap}
  .cip.secili{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 12px rgba(0,229,255,.35)}
  .ortak{border-color:#00e5ff80!important;background:linear-gradient(90deg,#ff2e8840,#00e5ff40);color:#fff}

  /* Açık tema: body.acik sınıfı ile etkinleşir */
  body.acik{background:#f4f2fb;color:#1a1530}
  body.acik .telefon{background:#ffffff;border-color:#e4def5}
  body.acik .bg-\[\#0d0818\]{background:#ffffff}
  body.acik .border-\[\#0d0818\]{border-color:#ffffff}
  body.acik .bg-white\/5{background:rgba(0,0,0,.04)}
  body.acik .bg-white\/10{background:rgba(0,0,0,.07)}
  body.acik .border-white\/10{border-color:rgba(0,0,0,.1)}
  body.acik .border-white\/20{border-color:rgba(0,0,0,.2)}
  body.acik .bg-black\/50{background:rgba(0,0,0,.04)}
  body.acik .text-slate-200{color:#2a2540}
  body.acik .text-slate-300{color:#3b3550}
  body.acik .text-slate-400{color:#6b6580}
  body.acik .text-slate-500{color:#8a8599}
  body.acik .text-cyan-300{color:#0e7490}
  body.acik .sekme[aria-current="true"]{color:#0891b2;text-shadow:none}
  body.acik .cip{border-color:rgba(0,0,0,.15);background:rgba(0,0,0,.03)}
  body.acik .cip.secili{color:#0891b2;border-color:#0891b2;box-shadow:none}
  body.acik .cubuk{background:rgba(0,0,0,.12)}
  body.acik .cubuk>i{background:#1a1530}
  body.acik .eq span{background:#0891b2}
  body.acik #toast{background:#1a1530;color:#fff}
  body.acik .ortak{color:#1a1530}
  body.acik .kaydir::-webkit-scrollbar{display:none}
  body.acik .neon{background:linear-gradient(90deg,#db2777,#0891b2);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* Açık tema: koyu temanın renklerini beyaza çevirir */
  body.acik{background:#eef0f7;color:#1b1530}
  .acik .telefon{background:#ffffff;color:#1b1530}
  .acik .bg-\[\#0d0818\]{background:#ffffff !important}
  .acik .bg-white\/5{background:rgba(0,0,0,.04) !important}
  .acik .bg-white\/10{background:rgba(0,0,0,.08) !important}
  .acik .bg-black\/50{background:rgba(255,255,255,.9) !important}
  .acik .bg-black\/40{background:rgba(0,0,0,.08) !important}
  .acik .border-white\/10{border-color:rgba(0,0,0,.12) !important}
  .acik .border-white\/20{border-color:rgba(0,0,0,.25) !important}
  .acik .text-slate-300,.acik .text-slate-400,.acik .text-slate-500{color:#5b5670 !important}
  .acik .text-amber-300{color:#a35f00 !important}
  .acik .text-cyan-300{color:#0a7d94 !important}
  .acik .cip{background:rgba(0,0,0,.03)}
  .acik .cip.secili{color:#0a7d94 !important;border-color:#0a7d94}
  .acik .ortak{color:#1b1530 !important;background:linear-gradient(90deg,#ff2e8833,#00e5ff33)}
  .acik .cubuk{background:rgba(0,0,0,.12)}
  .acik .cubuk>i{background:#1b1530}
  .acik .eq span{background:#0a7d94}
  .acik #kart,.acik #kart *{color:#fff !important}
  .acik #kart .bg-black\/50{background:rgba(0,0,0,.5) !important}
  .acik #kart .bg-black\/40{background:rgba(0,0,0,.4) !important}
  .acik #kart .cip{background:rgba(0,0,0,.35) !important}
</style>
</head>
<body>
<div class="telefon" id="telefon">
  <header class="px-4 pt-4 pb-2 flex items-center justify-between">
    <div class="text-2xl font-black neon">VibeMatch</div>
    <div class="flex items-center gap-2"><button data-act="bildirimAc" class="relative mr-2 text-lg">🔔<span id="bildirimRozet" class="hidden absolute -top-1 -right-2 min-w-[16px] h-4 px-1 rounded-full bg-pink-500 text-[10px] font-bold text-white flex items-center justify-center"></span></button>
    <div class="text-xs px-3 py-1 rounded-full bg-amber-400/15 text-amber-300 border border-amber-400/30">🏆 <span id="puanRozet">0</span> puan</div><button data-act="sekme" data-sekme="ayarlar" title="Ayarlar" class="w-8 h-8 rounded-full bg-white/5 border border-white/10 text-sm">⚙️</button></div>
  </header>

  <main id="gorunum" class="flex-1 kaydir px-4 pb-4"></main>

  <nav id="nav" class="grid grid-cols-5 border-t border-white/10 bg-black/50 backdrop-blur-xl pt-2 pb-[max(env(safe-area-inset-bottom),8px)]">
    <button data-act="sekme" data-sekme="kesfet" class="sekme flex flex-col items-center gap-0.5 text-[11px] text-slate-400" aria-current="false"><span class="ikon text-lg">🔥</span><span data-i18n="nav_kesfet">Keşfet</span></button>
    <button data-act="sekme" data-sekme="akis" class="sekme flex flex-col items-center gap-0.5 text-[11px] text-slate-400" aria-current="false"><span class="ikon text-lg">📸</span><span data-i18n="nav_akis">Akış</span></button>
    <button data-act="sekme" data-sekme="liderlik" class="sekme flex flex-col items-center gap-0.5 text-[11px] text-slate-400" aria-current="false"><span class="ikon text-lg">🏆</span><span data-i18n="nav_liderlik">Liderlik</span></button>
    <button data-act="sekme" data-sekme="mesajlar" class="sekme relative flex flex-col items-center gap-0.5 text-[11px] text-slate-400" aria-current="false"><span class="ikon text-lg">💬</span><span data-i18n="nav_mesaj">Mesaj</span><span id="rozet" class="hidden absolute -top-1 right-3 min-w-[16px] h-4 px-1 rounded-full bg-pink-500 text-[10px] font-bold text-white flex items-center justify-center"></span></button>
    <button data-act="sekme" data-sekme="profil" class="sekme flex flex-col items-center gap-0.5 text-[11px] text-slate-400" aria-current="false"><span class="ikon text-lg">👤</span><span data-i18n="nav_profil">Profil</span></button>
  </nav>

  <div id="modal" class="absolute inset-0 z-40 hidden"></div>
  <div id="toast" class="hidden absolute bottom-24 left-1/2 -translate-x-1/2 z-50 bg-white text-black px-4 py-2 rounded-full text-sm font-semibold shadow-lg whitespace-nowrap"></div>
  <input type="file" id="hikayeDosya" accept="image/*" class="hidden">
  <input type="file" id="profilDosya" accept="image/*" class="hidden">
  <input type="file" id="reelsDosya" accept="image/*,video/*" class="hidden">
  <div id="girisEkrani" class="absolute inset-0 z-30 bg-[#0d0818] flex items-center justify-center p-6">
    <div class="w-full max-w-xs text-center">
      <div class="text-3xl font-black neon mb-1">VibeMatch</div>
      <div class="mb-6"></div>
      <div class="flex gap-2 mb-4">
        <button data-act="authMod" data-m="giris" class="flex-1 py-2 rounded-full border border-white/20 text-sm">Giriş</button>
        <button data-act="authMod" data-m="kayit" class="flex-1 py-2 rounded-full border border-white/20 text-sm">Kayıt</button>
      </div>
      <div id="authAdAlan" class="mb-2"><input id="authAd" maxlength="30" placeholder="Adın" class="w-full bg-white/5 border border-white/10 rounded-full px-4 py-2.5 text-sm outline-none focus:border-cyan-400"></div>
      <input id="authEmail" type="email" placeholder="E-posta" class="w-full mb-2 bg-white/5 border border-white/10 rounded-full px-4 py-2.5 text-sm outline-none focus:border-cyan-400">
      <input id="authSifre" type="password" placeholder="Şifre (en az 6 karakter)" class="w-full mb-3 bg-white/5 border border-white/10 rounded-full px-4 py-2.5 text-sm outline-none focus:border-cyan-400">
      <button id="authButon" data-act="authSubmit" data-m="kayit" class="w-full py-3 rounded-full bg-gradient-to-r from-pink-500 to-cyan-400 font-bold">Kayıt ol</button>
      <p id="girisMesaj" class="text-xs text-center min-h-[1rem] mt-3"></p>
      <button data-act="sifreUnuttum" class="mt-2 text-xs text-cyan-300 underline">Şifremi unuttum</button>
      <button data-act="demoGiris" class="mt-4 text-xs text-slate-400 underline">Demo ile devam et (sunucusuz)</button>
    </div>
  </div>
</div>

<script src="tailwind.js"></script>

<script>
/* ---------- Yardımcılar ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saat = () => new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
const ESK = 'Eskişehir';

/* Gradient "fotoğraf" yer tutucuları. Gerçek uygulamada kullanıcı fotoğraflarıyla değiştirilir. */
const GRAD = [
  'linear-gradient(160deg,#ff2e88,#7c3aed 60%,#0b0716)',
  'linear-gradient(160deg,#00e5ff,#2563eb 60%,#0b0716)',
  'linear-gradient(160deg,#ffd166,#f97316 55%,#0b0716)',
  'linear-gradient(160deg,#22c55e,#0d9488 55%,#0b0716)',
  'linear-gradient(160deg,#a855f7,#ec4899 55%,#0b0716)',
  'linear-gradient(160deg,#f43f5e,#be123c 55%,#0b0716)',
  'linear-gradient(160deg,#38bdf8,#6366f1 55%,#0b0716)',
  'linear-gradient(160deg,#fde047,#84cc16 55%,#0b0716)'
];
const VIBELAR = ['🎧 Müzik modu','🌙 Gece modu','☕ Sakin','🔥 Enerjik','🎮 Oyun modu','📚 Ders modu'];
const SARKILAR = [
  {b:'Gece Yolu', s:'Örnek Sanatçı'},
  {b:'Porsuk Akşamı', s:'Demo Band'},
  {b:'Kahve Molası', s:'Lo-fi Lab'},
  {b:'Sabaha Kadar', s:'Gece Kulübü'}
];
const CEVAPLAR = ['Haha kesin 😂','Sen de bir kahve ister misin?','Bu hafta sonu sinema var mı?','Bence bu müzik tam sana göre 🎧','Tamam, akşam buluşuruz 🌙'];

const BEN = {id:0, ad:'Sen', yas:21, sehir:ESK, bolum:'Üniversite öğrencisi', bio:'Kahve, kitap ve gece yürüyüşü ☕', ilgi:['Müzik','Kahve','Kitap','Sinema'], grad:GRAD[0]};

/* Tanıtım amaçlı kurgusal profiller (gerçek kişi değil) */
const KISILER = [
  {id:1, ad:'Elif',   yas:20, sehir:ESK,      bolum:'Psikoloji · 2. sınıf',  bio:'Sabah kahvesi, eski kitapçılar, Porsuk kenarı 🚲', ilgi:['Kitap','Kahve','Bisiklet'], vibe:'☕ Sakin',     not:'Kütüphanedeyim, gelen var mı?', grad:GRAD[0], sarki:2, puan:1280},
  {id:2, ad:'Mert',   yas:22, sehir:ESK,      bolum:'Mühendislik · 4. sınıf',bio:'Halı saha, sahil sabahları, kötü espri ⚽',        ilgi:['Müzik','Spor','Sinema'],    vibe:'🔥 Enerjik',   not:'Mod: Müzik 🎧',                grad:GRAD[1], sarki:1, puan:1110},
  {id:3, ad:'Zeynep', yas:21, sehir:ESK,      bolum:'Mimarlık · 3. sınıf',   bio:'Çizim defteri her zaman çantada ✏️',             ilgi:['Kahve','Sanat','Kitap'],    vibe:'📚 Ders modu', not:'Maket yetişmiyor 😵',          grad:GRAD[4], sarki:0, puan:960},
  {id:4, ad:'Kerem',  yas:23, sehir:'İzmir',  bolum:'Yazılım · Mezun',       bio:'Kod, kahve, sonra yine kod.',                    ilgi:['Müzik','Oyun','Teknoloji'], vibe:'🎮 Oyun modu', not:'Lobi açtım, gel 🎮',           grad:GRAD[6], sarki:3, puan:820},
  {id:5, ad:'Ayşe',   yas:20, sehir:ESK,      bolum:'Turizm · 2. sınıf',     bio:'Seyahat planı yapıyorum, Sazova hep bekler 🧺',  ilgi:['Seyahat','Fotoğraf','Kahve'], vibe:'🌙 Gece modu', not:'Gece yürüyüşü? 🌙',            grad:GRAD[2], sarki:0, puan:700},
  {id:6, ad:'Can',    yas:24, sehir:'Ankara', bolum:'Tıp · 5. sınıf',        bio:'Nöbet arası kısa molalar ☕',                    ilgi:['Spor','Müzik'],             vibe:'🎧 Müzik modu', not:'Uyanığım, kim var?',          grad:GRAD[5], sarki:1, puan:650},
  {id:7, ad:'Defne',  yas:21, sehir:ESK,      bolum:'İletişim · 3. sınıf',   bio:'Podcast önerisi bekliyorum 🎙️',                 ilgi:['Müzik','Kitap','Sinema'],   vibe:'🔥 Enerjik',   not:'Yeni podcast önerin var mı?', grad:GRAD[4], sarki:3, puan:1040},
  {id:8, ad:'Emre',   yas:22, sehir:'İstanbul', bolum:'Hukuk · 4. sınıf',    bio:'Vapurda müzik, Kadıköy\'de kahve.',              ilgi:['Müzik','Kahve','Spor'],     vibe:'☕ Sakin',     not:'Vapurdayım 🚢',                grad:GRAD[3], sarki:2, puan:590}
];

const kisi = id => KISILER.find(p => p.id == id);
const ortakIlgi = p => p.ilgi.filter(i => BEN.ilgi.includes(i));
const skor = p => (p.sehir === ESK ? 50 : 0) + ortakIlgi(p).length * 12 + Math.random() * 10;

/* ---------- Durum ---------- */
/* Yönetici e-postası: bu hesapla giriş yapınca Ayarlar'da yönetici paneli görünür */
const ADMIN_EPOSTA = "trtr3831@gmail.com";

const st = {
  sekme: 'kesfet',
  sira: 0,
  deste: [],
  animasyon: false,
  eslesmeler: [1, 2],
  sohbetler: {
    1: [
      {g:'them', t:'Selam! Eşleştik 😄', s:'21:02'},
      {g:'me', t:'Merhaba! Porsuk kenarında mı takılıyorsun?', s:'21:03', d:'goruldu', gt:'21:04'},
      {g:'them', t:'Evet, bu akşam kahve molası ☕🚲', s:'21:05'}
    ],
    2: [
      {g:'them', t:'Bu hafta halı saha var mı?', s:'20:40'},
      {g:'me', t:'Perşembe olabilir ⚽', s:'20:44', d:'iletildi'}
    ]
  },
  okunmamis: {},
  sohbetId: null,
  vibe: VIBELAR[0],
  benHikayeler: [],
  acikYorum: null,
  bekleyenFoto: null,
  benFoto: null,
  tema: "koyu",
  kullanici: null,
  sarki: null,
  reels: [],
  gruplar: [],
  grupAcik: null,
  bildirimler: [],
  takipEdilen: [],
  gizlilik: "herkes",
  kirpResim: null,
  oturum: null,
  dil: "tr",
  engelli: [],
  sikayetHedef: null,
  fotoHedef: "profil",
  authMod: "giris",
  benHikayeSayi: 0,
  hikayeler: [
    {ad:'Elif',   grad:GRAD[0], metin:'Porsuk kenarı, sabah kahvesi ☕', goruldu:false, t: Date.now()},
    {ad:'Mert',   grad:GRAD[1], metin:'Halı saha perşembe 😎', goruldu:false, t: Date.now()},
    {ad:'Zeynep', grad:GRAD[4], metin:'Maket bitti, şimdi uyku 🛌', goruldu:false, t: Date.now()},
    {ad:'Defne',  grad:GRAD[2], metin:'Yeni podcast bölümü çıktı 🎙️', goruldu:false, t: Date.now()}
  ],
  gonderiler: [
    {id:1, yazar:'Mert',   sehir:ESK, metin:'Vapurda gün batımı… Eskişehir bugün başka güzel 🌅', grad:GRAD[2], begeni:42, begendim:false, zaman:'12 dk önce'},
    {id:2, yazar:'Zeynep', sehir:ESK, metin:'Kütüphane sınavı bitti! Kim kahve ister? ☕',       grad:GRAD[3], begeni:27, begendim:false, zaman:'40 dk önce'},
    {id:3, yazar:'Kerem',  sehir:'İzmir', metin:'Hafta sonu Sazova\'da piknik? 🧺',            grad:GRAD[6], begeni:18, begendim:false, zaman:'1 sa önce'},
    {id:4, yazar:'Defne',  sehir:ESK, metin:'Bu akşamın playlist\'i hazır 🎧',                  grad:GRAD[4], begeni:65, begendim:false, zaman:'2 sa önce'}
  ],
  benGonderiler: [],
  calan: false,
  parca: 0,
  ilerleme: 0,
  kartCalan: false,
  not: null,
  toastZ: null,
  hikayeZ: null
};

function puanHesapla() {
  const alinanBegeni = st.benGonderiler.reduce((a, g) => a + g.begeni, 0);
  return 240 + alinanBegeni * 10 + st.benHikayeSayi * 15 + st.eslesmeler.length * 5;
}

function notGetir() {
  if (st.not && Date.now() - st.not.t < 864e5) return st.not;
  return null;
}
function kalanMetin(n) {
  const k = 864e5 - (Date.now() - n.t);
  return Math.floor(k / 36e5) + ' sa ' + Math.floor((k % 36e5) / 6e4) + ' dk';
}

/* Öncelik: Eskişehir profilleri ve ortak ilgi alanları önde */
function desteOlustur() {
  st.deste = KISILER
    .filter(p => !st.eslesmeler.includes(p.id) && !engelliMi(p.id))
    .map(p => ({p, s: skor(p)}))
    .sort((a, b) => b.s - a.s)
    .map(x => x.p);
  st.sira = 0;
}

/* ---------- Görünümler ---------- */
function avatar(p, boyut) {
  return `<div class="${boyut} rounded-full flex items-center justify-center font-black shrink-0" style="background:${p.grad}">${esc(p.ad[0])}</div>`;
}

function kesfetHTML() {
  const p = st.deste[st.sira];
  if (!p) return `
    <div class="h-full flex flex-col items-center justify-center text-center gap-4 giris">
      <div class="text-6xl">🌙</div>
      <h2 class="text-2xl font-bold">Şimdilik bu kadar</h2>
      <p class="text-slate-400 text-sm">Yeni profiller için biraz sonra tekrar bak.</p>
      <button data-act="yenile" class="px-6 py-3 rounded-full bg-gradient-to-r from-pink-500 to-cyan-400 font-bold">Keşfi yenile</button>
    </div>`;
  const ort = ortakIlgi(p);
  const m = SARKILAR[p.sarki];
  return `
  <div class="pt-1 giris">
    <div class="flex justify-between items-center mb-3 text-xs text-slate-400">
      <span>${st.sira + 1}/${st.deste.length}</span>
      <span>Eskişehir öncelikli ✨</span>
    </div>
    <div id="kart" class="relative h-[56vh] min-h-[360px] rounded-3xl overflow-hidden select-none touch-none cursor-grab shadow-2xl" style="background:${p.grad}">

/* Fotoğrafı küçültüp gönderir (en uzun kenar en fazla 800px) */
function resimKucult(dosya, enBuyuk, cb) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, enBuyuk / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/jpeg", 0.85));
    };
    img.src = r.result;
  };
  r.readAsDataURL(dosya);
}

/* ---------- Ayarlar: tema ve şifre ---------- */
async function hashle(s) {
  try {
    const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return Array.from(new Uint8Array(d)).map(x => x.toString(16).padStart(2, "0")).join("");
  } catch (err) {
    let h = 0;
    for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0;
    return "yedek" + h;
  }
}

function hesapKaydet(h) {

async function authGonder() {
  const eposta = ($("#authEposta").value || "").trim().toLowerCase();
  const sifre = $("#authSifre").value;
  const msg = (t, ok) => {
    const m = $("#authMesaj");
    if (m) { m.textContent = cevir(t); m.className = "text-xs text-center min-h-[16px] " + (ok ? "text-emerald-400" : "text-rose-400"); }
  };
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(eposta)) return msg("Geçerli bir e-posta adresi gir.", false);
  if (sifre.length < 6) return msg("Şifre en az 6 karakter olmalı.", false);
  const h = hesaplar();
  const sh = await hashle(sifre);
  if (st.authMod === "kayit") {
    const tekrarEl = $("#authSifreTekrar");
    if (tekrarEl && tekrarEl.value !== sifre) return msg("Şifreler eşleşmiyor.", false);
    const dogum = ($("#authDogum") || {}).value || "";
    if (!dogum) return msg("Doğum tarihini gir.", false);
    if (yasHesapla(dogum) < 18) return msg("Bu uygulama yalnızca 18 yaş ve üzeri kullanıcılar içindir.", false);
    if (h[eposta]) return msg("Bu e-posta ile zaten kayıt var. Giriş yap sekmesini kullan.", false);
    h[eposta] = sh;
    if (!hesapKaydet(h)) return msg("Kayıt yapılamadı (tarayıcı depolaması kapalı).", false);
    try {
      const yaslar = JSON.parse(localStorage.getItem("vm_yaslar") || "{}");
      yaslar[eposta] = dogum;
      localStorage.setItem("vm_yaslar", JSON.stringify(yaslar));
    } catch (err) {}
  } else {
    if (!h[eposta]) return msg("Bu e-posta ile kayıt bulunamadı.", false);
    if (h[eposta] !== sh) return msg("Şifre yanlış.", false);
  }
  const askida = askidaListesi()[eposta];
  if (askida) return msg("Hesabın askıya alındı. Gerekçe: " + askida.gerekce, false);
  girisYap(eposta);
}

/* Giriş yapmış kişi kendi şifresini değiştirir */
async function sifreKaydet() {
  const eski = $("#sifreEski");
  const yeni = $("#sifreYeni");
  const tekrar = $("#sifreTekrar");
  const msg = (t, ok) => {
    const m = $("#sifreMesaj");
    if (m) { m.textContent = cevir(t); m.className = "text-xs mt-2 " + (ok ? "text-emerald-400" : "text-rose-400"); }
  };
  if (yeni.value.length < 6) return msg("Yeni şifre en az 6 karakter olmalı.", false);
  if (yeni.value !== tekrar.value) return msg("Yeni şifreler eşleşmiyor.", false);
  const h = hesaplar();
  if (await hashle(eski.value) !== h[st.oturum]) return msg("Mevcut şifre yanlış.", false);
  h[st.oturum] = await hashle(yeni.value);
  if (!hesapKaydet(h)) return msg("Şifre kaydedilemedi (tarayıcı depolaması kapalı).", false);
  toast("Şifren değiştirildi ✅");
  render();
}

/* Yaş hesabı: doğum tarihinden bugüne kadar kaç yıl geçtiği */
function yasHesapla(dogum) {
  const b = new Date(dogum);
  const n = new Date();
  let y = n.getFullYear() - b.getFullYear();
  const ay = n.getMonth() - b.getMonth();
  if (ay < 0 || (ay === 0 && n.getDate() < b.getDate())) y--;
  return y;
}

/* Doğum tarihi alanında seçilebilecek en son tarih: bugünden 18 yıl önce */
function enAzYasTarihi() {
  const d = new Date();
  d.setFullYear(d.getFullYear() - 18);
  return d.toISOString().slice(0, 10);
}

function adminIslem(t, islem) {
  if (!isAdmin()) return;
  const etiket = {uyar: "Uyar", askiya: "Askıya al", sil: "Hesabı sil", kapat: "Raporu kapat"}[islem];
  modalAc(`
    <div class="h-full bg-black/80 flex items-center justify-center p-6 giris">
      <div class="w-full max-w-xs bg-[#0d0818] rounded-2xl p-5 border border-white/10 space-y-3">
        <h3 class="font-black text-lg">${etiket}</h3>
        <p class="text-xs text-slate-400">Bu işlem denetim kaydına yazılır. Gerekçe zorunlu (en az 10 karakter).</p>
        <textarea id="adminGerekce" rows="3" maxlength="300" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm outline-none"></textarea>
        <p id="adminMesaj" class="text-xs text-rose-400 min-h-[16px]"></p>
        <button data-act="adminOnay" data-t="${t}" data-islem="${islem}" class="w-full py-2.5 rounded-full bg-gradient-to-r from-pink-500 to-cyan-400 font-bold text-sm">${etiket}</button>
        <button data-act="modalKapat" class="w-full py-2 text-xs text-slate-400">Vazgeç</button>
      </div>
    </div>`);
}

function adminOnay(t, islem) {
  if (!isAdmin()) return;
  const gerekce = (($("#adminGerekce") || {}).value || "").trim();
  if (gerekce.length < 10) {
    const m = $("#adminMesaj");
    if (m) m.textContent = cevir("Gerekçe en az 10 karakter olmalı.");
    return;
  }
  const raporlar = okuListe("vm_sikayet");
  const rapor = raporlar.find(r => String(r.t) === String(t));
  if (!rapor) return;
  const hedef = rapor.hedefEposta;
  if (islem === "kapat") {
    rapor.kapali = true;
  } else if (!hedef) {
    toast("Bu şikayetin bağlı bir hesabı yok (örnek profil).");
    return;
  } else if (islem === "uyar") {
    const b = bildirimListesi();
    (b[hedef] = b[hedef] || []).push({t: Date.now(), metin: "Yönetici uyarısı: " + gerekce});
    kaydetObjeler("vm_bildirim", b);
  } else if (islem === "askiya") {
    const a = askidaListesi();
    a[hedef] = {gerekce, t: Date.now()};
    kaydetObjeler("vm_askida", a);
    rapor.kapali = true;
  } else if (islem === "sil") {
    const h = hesaplar();
    delete h[hedef];
    hesapKaydet(h);
    const y = okuObje("vm_yaslar");
    delete y[hedef];
    kaydetObjeler("vm_yaslar", y);
    rapor.kapali = true;
  }
  kaydetListe("vm_sikayet", raporlar);
  denetimEkle({t: Date.now(), admin: st.oturum, islem, hedef: hedef || rapor.hedef, gerekce});
  modalKapat();
  toast("İşlem kaydedildi ✅");
  render();
}

function okuObje(anahtar) {
  try { return JSON.parse(localStorage.getItem(anahtar) || "{}"); } catch (err) { return {}; }
}

function bildirimlerHTML() {
  const liste = (bildirimListesi()[st.oturum] || []).slice(-10).reverse();
  if (!liste.length) return `<p class="text-xs text-slate-500">Bildirim yok.</p>`;
  return liste.map(b => `<div class="p-3 rounded-2xl bg-white/5 border border-white/10 text-xs">${esc(b.metin)}<div class="text-[10px] text-slate-500 mt-1">${tarih(b.t)}</div></div>`).join("");
}

/* Çeviri motoru: sözlük ve kalıplarla metni seçilen dile çevirir */
const DIL_SUTUN = {en: 1, ru: 2, zh: 3};
function cevir(metin) {
  const d = (st && st.dil) || "tr";
  if (d === "tr" || metin === null || metin === undefined) return metin;
  const ham = String(metin);
  const duz = ham.trim();
  if (!duz) return ham;
  const k = DIL_SUTUN[d];
  const sat = SOZLUK_SATIRLARI.find(r => r[0] === duz);
  if (sat) return ham.replace(duz, sat[k]);
  for (const kal of SOZLUK_KALIPLARI) {
    if (kal[0].test(duz)) return ham.replace(duz, duz.replace(kal[0], kal[k]));
  }
  return ham;
}

/* Bir kök öğenin içindeki tüm metinleri ve placeholder'ları çevirir */
function cevirDOM(kok) {
  if (!kok || (st.dil || "tr") === "tr") return;
  const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT);
  const dugumler = [];
  while (w.nextNode()) dugumler.push(w.currentNode);
  dugumler.forEach(n => { n.nodeValue = cevir(n.nodeValue); });
  kok.querySelectorAll("[placeholder]").forEach(el => { el.placeholder = cevir(el.placeholder); });
}

/* Tarih biçimi seçilen dile göre */
function tarih(zaman) {
  const yerel = {tr: "tr-TR", en: "en-US", ru: "ru-RU", zh: "zh-CN"}[st.dil || "tr"] || "tr-TR";
  return new Date(zaman).toLocaleString(yerel);
}

/* ---------- Kaydırma (swipe) ---------- */
function kartBaglan() {
  const k = $('#kart');
  if (!k) return;
  let x0 = null, dx = 0;
  const damgalar = () => ({sag: $('#dmg-sag'), sol: $('#dmg-sol')});
  k.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || st.animasyon) return;
    x0 = e.clientX;
    k.setPointerCapture(e.pointerId);
    k.style.transition = 'none';
  });
  k.addEventListener('pointermove', e => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    k.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    damgalar().sag.style.opacity = Math.max(0, dx / 120);
    damgalar().sol.style.opacity = Math.max(0, -dx / 120);
  });
  const bitir = () => {
    if (x0 === null) return;
    x0 = null;
    if (Math.abs(dx) > 110) {
      swipe(dx > 0 ? 'sag' : 'sol');
    } else {
      k.style.transition = 'transform .3s ease';
      k.style.transform = '';
      damgalar().sag.style.opacity = 0;
      damgalar().sol.style.opacity = 0;
    }
    dx = 0;
  };
  k.addEventListener('pointerup', bitir);
  k.addEventListener('pointercancel', bitir);
}

function swipe(yon) {
  if (st.animasyon) return;
  const k = $('#kart');
  const p = st.deste[st.sira];
  if (!k || !p) return;
  st.animasyon = true;
  k.style.transition = 'transform .35s ease, opacity .35s';
  k.style.transform = `translateX(${yon === 'sag' ? 700 : -700}px) rotate(${yon === 'sag' ? 30 : -30}deg)`;
  k.style.opacity = 0;
  setTimeout(() => {
    st.sira++;
    st.kartCalan = false;
    st.animasyon = false;
    if (yon === 'sag') eslestirmeDene(p);
    render();
  }, 330);
}

  if (m) return {embed: "https://open.spotify.com/embed/" + m[1] + "/" + m[2], kaynak: "spotify"};

}

/* ---------- Profil fotoğrafı kırpma ---------- */
const KIRP_BOYUT = 300;

function kirpCiz() {
  const c = document.getElementById("kirpCanvas");
  const img = st.kirpResim;
  if (!c || !img) return;
  const ctx = c.getContext("2d");
  const zoom = parseFloat(document.getElementById("kirpZoom").value);
  const kx = parseFloat(document.getElementById("kirpX").value);
  const ky = parseFloat(document.getElementById("kirpY").value);
  const taban = Math.max(KIRP_BOYUT / img.width, KIRP_BOYUT / img.height) * zoom;
  const dw = img.width * taban, dh = img.height * taban;
  const x = (KIRP_BOYUT - dw) / 2 + kx * Math.max(0, (dw - KIRP_BOYUT) / 2);
  const y = (KIRP_BOYUT - dh) / 2 + ky * Math.max(0, (dh - KIRP_BOYUT) / 2);
  ctx.clearRect(0, 0, KIRP_BOYUT, KIRP_BOYUT);
  ctx.drawImage(img, x, y, dw, dh);
}

function kirpAc(dataUrl) {
  const img = new Image();
  img.onload = () => {
    st.kirpResim = img;
    modalAc(`
      <div class="h-full bg-[#0d0818] overflow-y-auto p-6 giris">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-black">Fotoğrafı ayarla</h2>
          <button data-act="modalKapat" class="text-slate-400 text-xl">✕</button>
        </div>
        <div class="flex justify-center mb-4">
          <canvas id="kirpCanvas" width="${KIRP_BOYUT}" height="${KIRP_BOYUT}" class="rounded-full border-2 border-cyan-400" style="width:${KIRP_BOYUT}px;max-width:100%;height:auto"></canvas>
        </div>
        <label class="text-xs text-slate-400">Yakınlaştırma</label>
        <input id="kirpZoom" type="range" min="1" max="3" step="0.05" value="1" class="w-full mb-3">
        <label class="text-xs text-slate-400">Yatay kaydırma</label>
        <input id="kirpX" type="range" min="-1" max="1" step="0.02" value="0" class="w-full mb-3">
        <label class="text-xs text-slate-400">Dikey kaydırma</label>
        <input id="kirpY" type="range" min="-1" max="1" step="0.02" value="0" class="w-full mb-5">
        <button data-act="kirpKaydet" class="w-full py-3 rounded-full bg-gradient-to-r from-pink-500 to-cyan-400 font-bold">Profil fotoğrafı yap</button>
      </div>`);
    kirpCiz();
  };
  img.src = dataUrl;
}

function kirpKaydet() {
  const img = st.kirpResim;
  if (!img) return;
  const c = document.createElement("canvas");
  c.width = 400; c.height = 400;
  const k = 400 / KIRP_BOYUT;
  const zoom = parseFloat(document.getElementById("kirpZoom").value);
  const kx = parseFloat(document.getElementById("kirpX").value);
  const ky = parseFloat(document.getElementById("kirpY").value);
  const taban = Math.max(KIRP_BOYUT / img.width, KIRP_BOYUT / img.height) * zoom;
  const dw = img.width * taban * k, dh = img.height * taban * k;
  const x = (400 - dw) / 2 + kx * Math.max(0, (dw - 400) / 2);
  const y = (400 - dh) / 2 + ky * Math.max(0, (dh - 400) / 2);
  c.getContext("2d").drawImage(img, x, y, dw, dh);
  st.benFoto = c.toDataURL("image/jpeg", 0.85);
  try { localStorage.setItem("vm_foto", st.benFoto); } catch (err) {}
  st.kirpResim = null;
  modalKapat();
  toast("Profil fotoğrafın güncellendi 📸");
  render();
}

document.addEventListener("input", e => {
  if (e.target.id === "kirpZoom" || e.target.id === "kirpX" || e.target.id === "kirpY") kirpCiz();
});

      break;
    case 'hikaye': {
      const h = st.hikayeler[+d.i];
      if (h) { h.goruldu = true; hikayeAc(h); }
      break;
    }
    case 'hikayeKapat': hikayeKapat(); break;
    case 'paylas': {
      const t = $('#gonderiMetin').value.trim();
      if (!t && !st.bekleyenFoto) { toast('Önce bir şey yaz ✍️'); break; }
      st.benGonderiler.unshift({id: Date.now(), yazar: 'Sen', sehir: ESK, metin: t, grad: GRAD[Math.floor(Math.random() * GRAD.length)], begeni: 0, zaman: 'az önce', foto: st.bekleyenFoto, yorumlar: []}); st.bekleyenFoto = null;
      toast('Paylaşıldı! Beğeniler puanına eklenecek ✨');
      render();
      break;
    }
    case 'begeniGonderi': {
      const g = st.gonderiler.find(x => x.id == d.id);
      if (!g) break;
      g.begendim = !g.begendim;
      g.begeni += g.begendim ? 1 : -1;
      render();
      break;
    }
    case 'vibe': st.vibe = d.v; toast('Ruh halin: ' + d.v); render(); break;
    case 'notKaydet': {
      const v = $('#notGiris').value.trim();
      if (!v) { toast('Bir not yaz 📝'); break; }
      st.not = {metin: v.slice(0, 60), t: Date.now()};
      try { localStorage.setItem('vm_not', JSON.stringify(st.not)); } catch (err) {}
      toast('Notun 24 saat görünecek 💬');
      render();
      break;
    }
    case 'fotoSec': fotoKurallari('gonderi'); break;
    case 'yorumAc': st.acikYorum = st.acikYorum == d.id ? null : d.id; render(); break;
    case 'yorumGonder': yorumGonder(d.id); break;
    case 'profilFoto': fotoKurallari('profil'); break;
    case 'authSekme': st.authMod = d.m; render(); break;
    case 'authGonder': authGonder(); break;
    case 'cikis': cikis(); break;
    case 'sifreKaydet': sifreKaydet(); break;
    case 'tema': st.tema = d.t; temaUygula(); render(); break;
    case 'sikayetAc': sikayetAc(d.tur, d.id, d.ad); break;
    case 'sikayetGonder': sikayetGonder(+d.i); break;
    case 'engelleAc': engelleAc(d.id); break;
    case 'engelOnay': engelOnay(d.id); break;
    case 'engelKaldir': engelKaldir(d.id); break;
    case 'fotoOnay': fotoOnayla(); break;
    case 'sohbetFotoSec': fotoKurallari('sohbet'); break;
    case 'fotoAc': {
      const x = (st.sohbetler[d.id] || [])[+d.i];
      if (x) { x.acik = true; render(); }
      break;
    }
    case 'adminIslem': adminIslem(d.t, d.islem); break;
    case 'adminOnay': adminOnay(d.t, d.islem); break;
    case 'dil': dilDegistir(d.d); break;
    case 'authMod': {
      const kayit = d.m === 'kayit';
      $('#authAdAlan').classList.toggle('hidden', !kayit);
      const b = $('#authButon');
      b.textContent = kayit ? 'Kayıt ol' : 'Giriş yap';
      b.dataset.m = kayit ? 'kayit' : 'giris';
      girisMesaj('', false);
      break;
    }
    case 'authSubmit':
      if (d.m === 'kayit') hesapKayit();
      else if (d.m === 'yeni') yeniSifreKaydet();
      else hesapGiris();
      break;
    case 'sifreUnuttum': sifreSifirlaIste(); break;
    case 'demoGiris': girisEkraniGizle(); toast('Demo modundasın 🧪'); break;
    case 'cikis': cikis(); break;
    case 'sarkiEkle': {
      const s = sarkiCoz($('#sarkiLink').value);
      if (!s) { toast('Spotify veya YouTube bağlantısı yapıştır'); break; }
      st.sarki = s; sarkiKaydet(); toast('Şarkın profiline eklendi 🎵'); render();
      break;
    }
    case 'sarkiSil': st.sarki = null; sarkiKaydet(); render(); break;
    case 'reelsAc': reelsAc(); break;
    case 'profilGor': profilGor(d.id); break;
    case 'takipToggle': takipToggle(d.id); break;
    case 'bildirimAc': bildirimAc(); break;
    case 'bildirimTemizle': st.bildirimler = []; bildirimKaydet(); bildirimRozetGuncelle(); modalKapat(); break;
    case 'kirpKaydet': kirpKaydet(); break;
    case 'grupOlustur': grupOlustur(); break;
    case 'grupKaydet': grupKaydetIslem(); break;
    case 'grupAc': st.grupAcik = +d.id; render(); break;
    case 'grupKapat': st.grupAcik = null; render(); break;
    case 'grupGonder': grupGonder(d.id); break;
    case 'aiTanisma': aiTanisma(d.id); break;
    case 'aiDuzelt': aiDuzelt(); break;
    case 'aiBio': aiBio(); break;
    case 'aiSec': {
      const kutu = document.getElementById('aiKutu');
      const satir = kutu && kutu._satirlar ? kutu._satirlar[+d.i] : '';
      const hedef = document.getElementById(kutu && kutu.dataset.hedef === 'ayarBio' ? 'ayarBio' : 'mesajGiris');
      if (hedef && satir) { hedef.value = satir; hedef.focus(); }
      break;
    }
    case 'reelsEkle': $('#reelsDosya').click(); break;
    case 'ayarlar': ayarlarAc(); break;
    case 'ayarKaydet': ayarKaydet(); break;
    case 'cal': st.calan = !st.calan; render(); break;
    case 'parca': st.parca = +d.i; st.ilerleme = 0; st.calan = true; render(); break;
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'mesajGiris' && st.sohbetId != null) gonder(st.sohbetId);
  if (e.target.id && e.target.id.indexOf('yorum-') === 0) yorumGonder(e.target.id.slice(6));
  if (e.target.id === 'grupGiris' && st.grupAcik != null) grupGonder(st.grupAcik);
  if (e.target.id === 'notGiris') {
    const b = document.querySelector('[data-act="notKaydet"]');
    if (b) b.click();
  }
});

/* ---------- Başlatma ---------- */
try { st.benFoto = localStorage.getItem('vm_foto') || null; } catch (err) {}
try { st.takipEdilen = JSON.parse(localStorage.getItem('vm_takip') || '[]') || []; } catch (err) {}
try { st.gizlilik = localStorage.getItem('vm_gizlilik') === 'takipci' ? 'takipci' : st.gizlilik; } catch (err) {}
try { st.bildirimler = JSON.parse(localStorage.getItem('vm_bildirim') || '[]') || []; } catch (err) {}
try { st.gruplar = JSON.parse(localStorage.getItem('vm_gruplar') || '[]') || []; } catch (err) {}
try { st.sarki = JSON.parse(localStorage.getItem('vm_sarki') || 'null'); } catch (err) {}
try { st.tema = localStorage.getItem('vm_tema') === 'acik' ? 'acik' : 'koyu'; } catch (err) {}
temaUygula();
try {
  const kayitli = JSON.parse(localStorage.getItem('vm_not') || 'null');
  if (kayitli && Date.now() - kayitli.t < 864e5) st.not = kayitli;
} catch (err) {}

try {
  const e = localStorage.getItem('vm_oturum');
  if (e && hesaplar()[e] && !askidaListesi()[e]) st.oturum = e;
} catch (err) {}
try { st.engelli = okuListe("vm_engel").map(Number); } catch (err) { st.engelli = []; }
try { st.dil = localStorage.getItem("vm_dil") || "tr"; } catch (err) { st.dil = "tr"; }
hikayeleriTemizle();
st.gonderiler.forEach(g => { g.yorumlar = g.yorumlar || []; });
st.gonderiler[0].yorumlar.push({ad: "Elif", metin: "Harika fotoğraf!", zaman: "10 dk önce"});
st.gonderiler[1].yorumlar.push({ad: "Mert", metin: "Ben de geliyorum ☕", zaman: "30 dk önce"});
desteOlustur();
render();
setInterval(() => { if (hikayeleriTemizle() && st.sekme === 'akis') render(); }, 60000);

/* Müzik oynatıcı ilerlemesi (prototip: sahte ilerleme) */
setInterval(() => {
  if (!st.calan || st.sekme !== 'profil') return;
  st.ilerleme += 1.2;
  if (st.ilerleme >= 100) {
    st.ilerleme = 0;
    st.parca = (st.parca + 1) % SARKILAR.length;
    render();
    return;
  }
  const i = $('#ilerleme');
  if (i) i.style.width = st.ilerleme + '%';
}, 500);

/* Gönderilere sahte beğeni gelmesi (puan akışını gösterir) */
setInterval(() => {
  if (!st.benGonderiler.length) return;
  const g = st.benGonderiler[Math.floor(Math.random() * st.benGonderiler.length)];
  g.begeni++;
  toast('💗 Bir gönderin beğenildi! +10 puan');
  bildirimEkle('Bir gönderin beğenildi ❤️');
  if (st.sekme === 'liderlik' || st.sekme === 'profil') render();
  else $('#puanRozet').textContent = puanHesapla();
}, 25000);
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
