/* Fotoğrafı küçültüp gönderir (en uzun kenar en fazla 800px) */
function resimKucult(dosya, enBuyuk, cb) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, enBuyuk / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/jpeg", 0.85));
    };
    img.src = r.result;
  };
  r.readAsDataURL(dosya);
}

/* ---------- Ayarlar: tema ve şifre ---------- */
async function hashle(s) {
  try {
    const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return Array.from(new Uint8Array(d)).map(x => x.toString(16).padStart(2, "0")).join("");
  } catch (err) {
    let h = 0;
    for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0;
    return "yedek" + h;
  }
}

/* Yaş hesabı: doğum tarihinden bugüne kadar kaç yıl geçtiği */
function yasHesapla(dogum) {
  const b = new Date(dogum);
  const n = new Date();
  let y = n.getFullYear() - b.getFullYear();
  const ay = n.getMonth() - b.getMonth();
  if (ay < 0 || (ay === 0 && n.getDate() < b.getDate())) y--;
  return y;
}

/* Doğum tarihi alanında seçilebilecek en son tarih: bugünden 18 yıl önce */
function enAzYasTarihi() {
  const d = new Date();
  d.setFullYear(d.getFullYear() - 18);
  return d.toISOString().slice(0, 10);
}

function engelOnay(id) {
  const n = Number(id);
  if (!engelliMi(n)) st.engelli.push(n);
  kaydetListe("vm_engel", st.engelli);
  st.eslesmeler = st.eslesmeler.filter(x => x !== n);
  delete st.sohbetler[n];
  st.deste = st.deste.slice(0, st.sira).filter(p => !engelliMi(p.id))
    .concat(st.deste.slice(st.sira).filter(p => !engelliMi(p.id)));
  if (st.sohbetId == n) st.sohbetId = null;
  modalKapat();
  toast("Engellendi 🚫");
  render();
}

function engelKaldir(id) {

}

  if (!isAdmin()) return;
  const etiket = {uyar: "Uyar", askiya: "Askıya al", sil: "Hesabı sil", kapat: "Raporu kapat"}[islem];
  modalAc(`

    </div>`);

function adminOnay(t, islem) {
  if (!isAdmin()) return;
  const gerekce = (($("#adminGerekce") || {}).value || "").trim();
  if (gerekce.length < 10) {
    const m = $("#adminMesaj");
    if (m) m.textContent = cevir("Gerekçe en az 10 karakter olmalı.");
    return;
  }
  const raporlar = okuListe("vm_sikayet");
  const rapor = raporlar.find(r => String(r.t) === String(t));
  if (!rapor) return;
  const hedef = rapor.hedefEposta;
  if (islem === "kapat") {
    rapor.kapali = true;
  } else if (!hedef) {
    toast("Bu şikayetin bağlı bir hesabı yok (örnek profil).");
    return;
  } else if (islem === "uyar") {
    const b = bildirimListesi();
    (b[hedef] = b[hedef] || []).push({t: Date.now(), metin: "Yönetici uyarısı: " + gerekce});
    kaydetObjeler("vm_bildirim", b);
  } else if (islem === "askiya") {
    const a = askidaListesi();
    a[hedef] = {gerekce, t: Date.now()};
    kaydetObjeler("vm_askida", a);
    rapor.kapali = true;
  } else if (islem === "sil") {
    toast("Hesap silme Supabase panelinden yapılır.");
    return;
  }
  kaydetListe("vm_sikayet", raporlar);
  denetimEkle({t: Date.now(), admin: st.oturum, islem, hedef: hedef || rapor.hedef, gerekce});
  modalKapat();
  toast("İşlem kaydedildi ✅");
  render();
}

function okuObje(anahtar) {
  try { return JSON.parse(localStorage.getItem(anahtar) || "{}"); } catch (err) { return {}; }
}

function bildirimlerHTML() {
  const liste = (bildirimListesi()[st.oturum] || []).slice(-10).reverse();
  if (!liste.length) return `<p class="text-xs text-slate-500">Bildirim yok.</p>`;

}

}

function uygulaDil() {

}

/* Çeviri motoru: sözlük ve kalıplarla metni seçilen dile çevirir */
const DIL_SUTUN = {en: 1, ru: 2, zh: 3};
function cevir(metin) {
  const d = (st && st.dil) || "tr";
  if (d === "tr" || metin === null || metin === undefined) return metin;
  const ham = String(metin);
  const duz = ham.trim();
  if (!duz) return ham;
  const k = DIL_SUTUN[d];
  const sat = SOZLUK_SATIRLARI.find(r => r[0] === duz);
  if (sat) return ham.replace(duz, sat[k]);
  for (const kal of SOZLUK_KALIPLARI) {
    if (kal[0].test(duz)) return ham.replace(duz, duz.replace(kal[0], kal[k]));
  }
  return ham;
}

/* Bir kök öğenin içindeki tüm metinleri ve placeholder'ları çevirir */
function cevirDOM(kok) {
  if (!kok || (st.dil || "tr") === "tr") return;
  const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT);
  const dugumler = [];
  while (w.nextNode()) dugumler.push(w.currentNode);
  dugumler.forEach(n => { n.nodeValue = cevir(n.nodeValue); });
  kok.querySelectorAll("[placeholder]").forEach(el => { el.placeholder = cevir(el.placeholder); });
}

/* Tarih biçimi seçilen dile göre */
function tarih(zaman) {
  const yerel = {tr: "tr-TR", en: "en-US", ru: "ru-RU", zh: "zh-CN"}[st.dil || "tr"] || "tr-TR";
  return new Date(zaman).toLocaleString(yerel);
}

/* ---------- Çizim ve yardımcı arayüz ---------- */
function rozetGuncelle() {
  const toplam = Object.values(st.okunmamis).reduce((a, b) => a + b, 0);
  const r = $('#rozet');
  r.textContent = toplam;
  r.classList.toggle('hidden', !toplam);
}

function render() {
  const navEl = document.getElementById('nav');
  if (navEl) navEl.classList.toggle('hidden', !st.oturum);
  if (!st.oturum) { document.getElementById('gorunum').innerHTML = ''; return; }
  document.querySelectorAll('.sekme').forEach(b => b.setAttribute('aria-current', String(b.dataset.sekme === st.sekme)));
  rozetGuncelle();
  const arti = document.querySelector('[data-act="olusturAc"]');
  if (arti) arti.classList.toggle('hidden', !(st.sekme === 'akis' || st.sekme === 'profil'));
  const g = $('#gorunum');
  const gorunumler = {ara: araHTML, akis: akisHTML, mesajlar: mesajHTML, profil: profilHTML, ayarlar: ayarlarHTML, admin: adminHTML};
  g.innerHTML = gorunumler[st.sekme]();
  uygulaDil();
  cevirDOM(g);
  if (st.sekme === 'kesfet') kartBaglan();
  if (st.sekme === 'ara') kesfetYukle();
  if (st.sekme === 'mesajlar' && st.sohbetId != null) g.scrollTop = g.scrollHeight;
}

function toast(m) {
  const t = $('#toast');
  t.textContent = cevir(m);
  t.classList.remove('hidden');
  clearTimeout(st.toastZ);
  st.toastZ = setTimeout(() => t.classList.add('hidden'), 2200);
}

function modalAc(html) {
  const m = $('#modal');
  const baslik = ((html.match(/<h[23][^>]*>([^<]*)</) || [])[1] || "").trim();
  // Başlığı olan bir ekranın üstüne başka bir ekran açılırsa, geri dönülebilsin diye önceki ekran saklanır
  if (!m.classList.contains('hidden') && st.modalBaslik && baslik !== st.modalBaslik) {
    st.modalYigin.push({html: m.innerHTML, baslik: st.modalBaslik});
    if (st.modalYigin.length > 8) st.modalYigin.shift();
  }
  st.modalBaslik = baslik;
  // ✕ ya da ← yoksa, ortak kapatma düğmesi eklenir
  const kapatli = /✕|←/.test(html)
    ? html
    : html + '<button data-act="modalKapat" class="absolute top-3 right-3 z-50 w-9 h-9 rounded-full bg-black/60 text-xl text-white" aria-label="Kapat">✕</button>';
  m.innerHTML = kapatli;
  m.classList.remove('hidden');
  cevirDOM(m);
}
function modalKapat() {
  const m = $('#modal');
  st.modalYigin = [];
  st.modalBaslik = '';
  m.innerHTML = '';
  m.style.bottom = '';
  m.classList.add('hidden');
}

// ✕ / ← / "Vazgeç" düğmeleri: bir önceki ekrana döner; yoksa kapatır
function modalGeri() {
  const onceki = st.modalYigin.pop();
  if (!onceki) { modalKapat(); return; }
  const m = $('#modal');
  st.modalBaslik = onceki.baslik;
  m.innerHTML = onceki.html;
  cevirDOM(m);
}

/* ---------- Kaydırma (swipe) ---------- */
function kartBaglan() {
  const k = $('#kart');
  if (!k) return;
  let x0 = null, dx = 0;
  const damgalar = () => ({sag: $('#dmg-sag'), sol: $('#dmg-sol')});
  k.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || st.animasyon) return;
    x0 = e.clientX;
    k.setPointerCapture(e.pointerId);
    k.style.transition = 'none';
  });
  k.addEventListener('pointermove', e => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    k.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    damgalar().sag.style.opacity = Math.max(0, dx / 120);
    damgalar().sol.style.opacity = Math.max(0, -dx / 120);
  });
  const bitir = () => {
    if (x0 === null) return;
    x0 = null;
    if (Math.abs(dx) > 110) {
      swipe(dx > 0 ? 'sag' : 'sol');
    } else {
      k.style.transition = 'transform .3s ease';
      k.style.transform = '';
      damgalar().sag.style.opacity = 0;
      damgalar().sol.style.opacity = 0;
    }
    dx = 0;
  };
  k.addEventListener('pointerup', bitir);
  k.addEventListener('pointercancel', bitir);
}

function swipe(yon) {
  if (st.animasyon) return;
  const k = $('#kart');
  const p = st.deste[st.sira];
  if (!k || !p) return;
  st.animasyon = true;
  k.style.transition = 'transform .35s ease, opacity .35s';
  k.style.transform = `translateX(${yon === 'sag' ? 700 : -700}px) rotate(${yon === 'sag' ? 30 : -30}deg)`;
  k.style.opacity = 0;
  setTimeout(() => {
    st.sira++;
    st.kartCalan = false;
    st.animasyon = false;
    if (yon === 'sag') eslestirmeDene(p);
    render();
  }, 330);
}

/* Prototip: beğenilerin bir kısmı karşılıklı kabul edilir */
function eslestirmeDene(p) {
  if (Math.random() < 0.45) {
    if (!st.eslesmeler.includes(p.id)) st.eslesmeler.push(p.id);
    st.sohbetler[p.id] = [{g:'them', t:'Selam! Sen de bu gece kahve modunda mısın? ☕', s:saat()}];
    bildirimEkle(p.ad + ' ile eşleştin 💞');
    eslesmeModal(p);
  } else {
    toast(p.ad + ' için beğenini gönderdin 💗');
  }
}

  modalAc(`

function sohbetAc(id) {
  st.sohbetId = id;
  st.sekme = 'mesajlar';
  st.okunmamis[id] = 0;
  setTimeout(() => {
    (st.sohbetler[id] || []).forEach(x => {
      if (x.g === 'me' && x.d === 'iletildi') { x.d = 'goruldu'; x.gt = saat(); }
    });
    if (st.sohbetId == id) render();
  }, 1000);
}

function gonder(id) {
  const inp = $('#mesajGiris');
  const t = inp ? inp.value.trim() : '';
  if (!t) return;
  const m = st.sohbetler[id] || (st.sohbetler[id] = []);
  const yeni = {g:'me', t: t.slice(0, 200), s: saat(), d:'iletildi'};
  m.push(yeni);
  render();
  const girisAlani = $('#mesajGiris');
  if (girisAlani) girisAlani.focus();
  setTimeout(() => {
    yeni.d = 'goruldu';
    yeni.gt = saat();
    if (st.sohbetId == id && st.sekme === 'mesajlar') render();
  }, 1500);
  setTimeout(() => {
    m.push({g:'them', t: CEVAPLAR[Math.floor(Math.random() * CEVAPLAR.length)], s: saat()});
    if (st.sohbetId == id && st.sekme === 'mesajlar') {
      render();
    } else {
      st.okunmamis[id] = (st.okunmamis[id] || 0) + 1;
      rozetGuncelle();
    }
  }, 2800);
}

/* ---------- Hikayeler (sunucu, 24 saat) ---------- */
async function hikayeYukle() {
  if (!sb || !st.kullanici) return;
  const sinir = new Date(Date.now() - 864e5).toISOString();
  const {data} = await sb.from("hikayeler").select("id,user_id,foto,created_at").gt("created_at", sinir).order("created_at", {ascending: false}).limit(80);
  const benim = st.kullanici.id;
  const gruplar = {};
  (data || []).forEach(h => {
    if (h.user_id === benim) return;
    (gruplar[h.user_id] = gruplar[h.user_id] || []).push(h);
  });
  const ids = Object.keys(gruplar);
  const adlar = {};
  if (ids.length) {
    const {data: pr} = await sb.from("profiles").select("id,ad").in("id", ids);
    (pr || []).forEach(p => { adlar[p.id] = p.ad; });
  }
  await profilFotolariYukle(ids);
  st.dbHikayeler = ids.map(uid => ({uid: uid, ad: adlar[uid] || "Kullanıcı", grad: dbGrad(uid), hikayeler: gruplar[uid]}));
  if (st.sekme === "akis") render();
}


/* ---------- Hikaye oynatıcı: birden fazla hikaye, ilerleme çubuğu, dokunarak geçiş ---------- */
function dbHikayeAc(uid) { oynatAc(uid, st.dbHikayeler); }

async function oynatAc(uid, gruplar) {
  const liste = gruplar || st.dbHikayeler;
  const bas = liste.findIndex(g => g.uid == uid);
  if (bas < 0 || !liste[bas].hikayeler.length) return;
  await hikayeBegeniYukle(liste.flatMap(g => g.hikayeler.map(x => x.id)));
  st.oyn = {gruplar: liste, g: bas, s: 0};
  oynatGoster();
}

function oynatGoster() {
  const o = st.oyn;
  if (!o) return;
  const grup = o.gruplar[o.g];
  const s = grup && grup.hikayeler[o.s];
  if (!s) { oynatKapat(); return; }
  const avatarFoto = grup.uid == (st.kullanici && st.kullanici.id) ? st.benFoto : (st.profilMap[grup.uid] || {}).foto;
  const cubuklar = grup.hikayeler.map((_, k) => `<div class="flex-1 h-0.5 rounded bg-white/30 overflow-hidden"><div class="h-full bg-white ${k === o.s ? "oynat-cubuk" : ""}" style="width:${k < o.s ? 100 : 0}%"></div></div>`).join("");
  modalAc(`
    <div class="relative w-full h-full bg-black overflow-hidden">
      <img src="${s.foto}" class="absolute inset-0 w-full h-full object-contain">
      <div class="absolute top-3 left-3 right-3 flex gap-1 z-10">${cubuklar}</div>
      <div class="absolute top-7 left-3 right-3 z-10 flex items-center gap-2">
        <div class="w-8 h-8 rounded-full overflow-hidden flex items-center justify-center text-sm font-black" style="background:${grup.grad}">${avatarFoto ? `<img src="${avatarFoto}" class="w-full h-full object-cover">` : esc((grup.ad || "?")[0])}</div>
        <span class="font-semibold text-sm truncate">${esc(grup.ad)}</span>
        <span class="text-[11px] text-slate-300">${zamanYaz(s.created_at)}</span>
        ${grup.uid == (st.kullanici && st.kullanici.id) ? '<button data-act="hikayeEkle" class="ml-auto text-xl px-2" aria-label="Yeni hikaye">＋</button>' : ""}
        ${grup.uid == (st.kullanici && st.kullanici.id) ? `<button data-act="hikayeMenuAc" data-id="${s.id}" class="text-xl px-2" aria-label="Seçenekler">⋯</button>` : ""}
        <button data-act="oynatKapat" class="${grup.uid == (st.kullanici && st.kullanici.id) ? "" : "ml-auto "}text-xl px-2" aria-label="Kapat">✕</button>
      </div>
      ${grup.uid == (st.kullanici && st.kullanici.id) ? "" : `<div class="absolute bottom-5 left-3 right-16 z-20 flex gap-2"><input id="oynatYanit" maxlength="120" placeholder="Hikayeye yanıt yaz…" onfocus="clearTimeout(st.oynZ)" class="flex-1 bg-black/40 border border-white/20 rounded-full px-4 py-2 text-sm outline-none focus:border-cyan-400"><button data-act="oynatYanitGonder" data-id="${grup.uid}" class="px-4 rounded-full bg-cyan-400 text-black font-bold text-sm">Gönder</button></div>`}
      ${grup.uid == (st.kullanici && st.kullanici.id) ? "" : `<button id="hbKalp" data-act="hbToggle" data-id="${s.id}" class="kalp absolute right-3 bottom-5 z-20 w-11 h-11 rounded-full bg-black/40 text-2xl flex items-center justify-center" aria-label="Beğen">${st.hbBegenen[s.id] ? "❤️" : "🤍"}</button>`}
      ${grup.uid == (st.kullanici && st.kullanici.id) ? `<button data-act="hikayeGoruntuleyenler" data-id="${s.id}" class="absolute bottom-5 left-3 z-20 h-9 px-3 rounded-full bg-black/60 text-white text-xs font-semibold flex items-center gap-1 shadow"><span>👁</span><span id="hgSayac">…</span></button>` : ""}
      <button data-act="oynatGeri" class="absolute left-0 top-20 bottom-0 w-1/3 z-0" aria-label="Önceki hikaye"></button>
      <button data-act="oynatIleri" class="absolute right-0 top-20 bottom-0 w-2/3 z-0" aria-label="Sonraki hikaye"></button>
    </div>`);
  requestAnimationFrame(() => {
    const c = document.querySelector(".oynat-cubuk");
    if (c) { c.style.transition = "width 5s linear"; c.style.width = "100%"; }
  });
  if (st.kullanici && grup.uid == st.kullanici.id) hikayeSayacYukle(s.id);
  else hikayeGoruntuKaydet(s.id);
  clearTimeout(st.oynZ);
  st.oynZ = setTimeout(() => {
    if (st.oyn && document.querySelector('[data-act="oynatIleri"]')) oynatIleri();
  }, 5000);
}

function oynatIleri() {
  const o = st.oyn;
  if (!o) return;
  const grup = o.gruplar[o.g];
  if (o.s < grup.hikayeler.length - 1) o.s++;
  else if (o.g < o.gruplar.length - 1) { o.g++; o.s = 0; }
  else { oynatKapat(); return; }
  oynatGoster();
}

function oynatGeri() {
  const o = st.oyn;
  if (!o) return;
  if (o.s > 0) o.s--;
  else if (o.g > 0) { o.g--; o.s = o.gruplar[o.g].hikayeler.length - 1; }
  oynatGoster();
}

function oynatKapat() {
  clearTimeout(st.oynZ);
  st.oyn = null;
  modalKapat();
}

    <p id="kasaMesaj" class="text-xs text-center min-h-[1rem]"></p>`;
}

function kayitSekmeAc(s) {
  st.kayitSekme = s;
  if (s === "kasa" && st.kasaPinHash === undefined) { kasaYukle(); return; }
  render();
}

async function kasaYukle() {
  if (!sb || !st.kullanici) return;
  const {data, error} = await sb.from("kasa_ayar").select("pin_hash").eq("user_id", st.kullanici.id).maybeSingle();
  if (error) { toast("Kasa yüklenemedi: " + error.message); st.kasaPinHash = null; render(); return; }
  st.kasaPinHash = data ? data.pin_hash : null;
  render();
}

async function kasaOgeYukle() {
  const {data} = await sb.from("kasa_ogeleri").select("id,foto,created_at").eq("user_id", st.kullanici.id).order("created_at", {ascending: false});
  st.kasaOgeler = data || [];
}

function kasaPinGecerli(p) {
  return /^\d{4,6}$/.test(p);
}

async function kasaKur() {
  const p1 = (document.getElementById("kasaPin1").value || "").trim();
  const p2 = (document.getElementById("kasaPin2").value || "").trim();
  if (!kasaPinGecerli(p1)) return kasaMesaj("PIN 4 ile 6 rakam olmalı.", true);
  if (p1 !== p2) return kasaMesaj("İki PIN aynı değil.", true);
  const h = await kasaSifre(p1);
  const {error} = await sb.from("kasa_ayar").upsert({user_id: st.kullanici.id, pin_hash: h});
  if (error) return kasaMesaj("Kaydedilemedi: " + error.message, true);
  st.kasaPinHash = h;
  st.kasaAcik = true;
  st.kasaDeneme = 0;
  await kasaOgeYukle();
  toast("Gizli kasa oluşturuldu 🔒");
  render();
}

async function kasaAc() {
  if (Date.now() < st.kasaKilitBitis) return kasaMesaj("Çok fazla yanlış deneme. Bir dakika bekle.", true);
  const p = (document.getElementById("kasaPinGiris").value || "").trim();
  const h = await kasaSifre(p);
  if (h !== st.kasaPinHash) {
    st.kasaDeneme++;
    if (st.kasaDeneme >= 5) {
      st.kasaDeneme = 0;
      st.kasaKilitBitis = Date.now() + 60000;
      return render();
    }
    return kasaMesaj("Yanlış PIN (" + st.kasaDeneme + "/5).", true);
  }
  st.kasaDeneme = 0;
  st.kasaAcik = true;
  await kasaOgeYukle();
  render();
}

function kasaKilitle() {
  st.kasaAcik = false;
  st.kasaOgeler = [];
  st.kasaPinFormu = false;
  render();
}

function kasaPinFormAc() {
  st.kasaPinFormu = !st.kasaPinFormu;
  render();
}

async function kasaPinKaydet() {
  const eski = (document.getElementById("kasaEskiPin").value || "").trim();
  const y1 = (document.getElementById("kasaYeniPin1").value || "").trim();
  const y2 = (document.getElementById("kasaYeniPin2").value || "").trim();
  if ((await kasaSifre(eski)) !== st.kasaPinHash) return kasaMesaj("Mevcut PIN yanlış.", true);
  if (!kasaPinGecerli(y1)) return kasaMesaj("Yeni PIN 4 ile 6 rakam olmalı.", true);
  if (y1 !== y2) return kasaMesaj("Yeni PIN'ler aynı değil.", true);
  const h = await kasaSifre(y1);
  const {error} = await sb.from("kasa_ayar").upsert({user_id: st.kullanici.id, pin_hash: h});
  if (error) return kasaMesaj("Güncellenemedi: " + error.message, true);
  st.kasaPinHash = h;
  st.kasaPinFormu = false;
  toast("PIN güncellendi ✅");
  render();
}

// Galeriden seçilen fotoğraf kasaya eklenir (küçültülüp kaydedilir)
async function kasaDosyaEkle(girdi) {
  const f = girdi.files[0];
  girdi.value = "";
  if (!f || !sb || !st.kullanici) return;
  try {
    const veri = await gorselKucult(f, 800);
    const {error} = await sb.from("kasa_ogeleri").insert({foto: veri});
    if (error) { toast("Eklenemedi: " + error.message); return; }
    toast("Kasaya eklendi 🔒");
    await kasaOgeYukle();
    render();
  } catch (err) {
    toast("Görsel yüklenemedi");
  }
}

async function kasaCikar(id) {
  const {data, error} = await sb.from("kasa_ogeleri").delete().eq("id", Number(id)).eq("user_id", st.kullanici.id).select("id");
  if (error || !data || !data.length) { toast("Çıkarılamadı: " + (error ? error.message : "yetki yok")); return; }
  toast("Kasadan çıkarıldı");
  await kasaOgeYukle();
  render();
}

document.addEventListener("change", e => {
  if (e.target.id === "kasaDosya") kasaDosyaEkle(e.target);
});

/* Kaydedilenler (profil sekmesi) */
function profilSekme(s) {
  st.profilSekme = s;
  if (s !== "kayit") { st.kasaAcik = false; st.kasaOgeler = []; st.kasaPinFormu = false; }
  if (s === "kayit") { kaydedilenYukle(); return; }
  render();
}

// Kaydedilen gönderileri sunucudan yükler (akışta olmayan eski gönderiler dahil)
async function kaydedilenYukle() {
  if (!sb || !st.kullanici) return;
  const {data: kay, error} = await sb.from("kaydedilenler").select("gonderi_id").eq("user_id", st.kullanici.id).order("created_at", {ascending: false}).limit(120);
  if (error) { toast("Kaydedilenler yüklenemedi: " + error.message); return; }
  const ids = (kay || []).map(k => k.gonderi_id);
  let gs = [];
  if (ids.length) {
    const {data} = await sb.from("gonderiler").select("id,user_id,yazar,metin,foto,fotolar").in("id", ids);
    gs = data || [];
  }
  const sira = new Map(ids.map((id, i) => [id, i]));
  gs.sort((x, y) => sira.get(x.id) - sira.get(y.id));
  st.dbKayitli = gs.map(g => ({id: g.id, sahip: g.user_id, yazar: g.yazar || "Kullanıcı", metin: g.metin || "", foto: (g.fotolar && g.fotolar[0]) || g.foto, grad: dbGrad(g.user_id)}));
  st.kaydedilen = ids;
  if (st.sekme === 'profil') render();
}

function kayitListeHTML() {
  const liste = st.dbKayitli || [];
  if (!liste.length) return `<p class="text-center text-slate-400 py-10 text-sm">Henüz kaydettiğin bir gönderi yok. Gönderide 📑 simgesine dokun.</p>`;
  return `<div class="grid grid-cols-3 gap-1 mt-2">${liste.map(g => `
    <button data-act="kayitliAc" data-id="${g.id}" class="aspect-square rounded-lg overflow-hidden" style="background:${g.grad}">
      ${g.foto ? `<img src="${g.foto}" class="w-full h-full object-cover">` : `<div class="w-full h-full p-2 text-[11px] font-semibold flex items-end text-left">${esc(g.metin.slice(0, 80))}</div>`}
    </button>`).join("")}</div>`;
}

function kayitliAc(id) {
  const g = (st.dbKayitli || []).find(x => x.id == id);
  if (!g) return;
  modalAc(`
    <div class="h-full bg-black flex flex-col items-center justify-center p-6 giris">
      ${g.foto ? `<img src="${g.foto}" class="max-h-[60%] rounded-2xl object-contain">` : `<div class="max-w-xs p-6 rounded-2xl text-center text-lg font-bold" style="background:${g.grad}">${esc(g.metin)}</div>`}
      <p class="text-sm mt-3 text-slate-300">${esc(g.yazar)}</p>
      <div class="flex gap-2 mt-5 w-full max-w-xs">
        <button data-act="kayitliGor" data-id="${g.id}" class="flex-1 py-2.5 rounded-full border border-white/20 text-sm">Gönderiyi aç</button>
        <button data-act="kayitliCikar" data-id="${g.id}" class="flex-1 py-2.5 rounded-full border border-rose-400 text-rose-300 text-sm">Kaydedilenlerden çıkar</button>
      </div>
      <button data-act="modalKapat" class="mt-4 text-sm text-slate-400">Kapat</button>
    </div>`);
}

// Akışta yüklü ise yorumlarıyla birlikte aç
function kayitliGor(id) {
  if (!st.dbGonderiler.some(x => x.id == id)) { toast("Bu gönderi akışta yüklü değil; görseli yukarıda gördün"); return; }
  modalKapat();
  gonderiDetay(id);
}

async function kayitliCikar(id) {
  if (!sb || !st.kullanici) return;
  const {data, error} = await sb.from("kaydedilenler").delete().eq("user_id", st.kullanici.id).eq("gonderi_id", Number(id)).select("gonderi_id");
  if (error || !data || !data.length) { toast("Çıkarılamadı: " + (error ? error.message : "yetki yok")); return; }
  modalKapat();
  toast("Kaydedilenlerden çıkarıldı");
  kaydedilenYukle();
}

/* ---------- Hikayelerim ve hikaye beğenisi (sunucu) ---------- */
// Kendi aktif (24 saat içinde, arşive düşmemiş) hikayelerim, eskiden yeniye
function aktifHikayeler() {
  const simdi = Date.now();
  return (st.dbArsiv || [])
    .filter(h => !h.is_archived && simdi - new Date(h.created_at).getTime() < 864e5)
    .slice()
    .sort((a, b) => (a.created_at < b.created_at ? -1 : 1));
}

// "Hikayen" çemberi: aktif hikaye varsa oynatıcı, yoksa dosya seçici
function hikayeBen() {
  const a = aktifHikayeler();
  if (a.length && st.kullanici) oynatAc(st.kullanici.id, [{uid: st.kullanici.id, ad: BEN.ad, grad: BEN.grad, foto: st.benFoto, hikayeler: a}]);
  else $('#hikayeDosya').click();
}

async function hikayeBegeniYukle(ids) {
  if (!sb || !st.kullanici || !ids.length) return;
  const {data} = await sb.from("hikaye_begeniler").select("hikaye_id").eq("user_id", st.kullanici.id).in("hikaye_id", ids);
  (data || []).forEach(r => { st.hbBegenen[r.hikaye_id] = true; });
}

// Kalp: anında dolar, sunucuya yazılır; hata olursa eski duruma döner
async function hbToggle(sid) {
  if (!sb || !st.kullanici) return;
  const id = Number(sid);
  const acik = !!st.hbBegenen[id];
  const btn = document.getElementById("hbKalp");
  st.hbBegenen[id] = !acik;
  if (btn) {
    btn.textContent = acik ? "🤍" : "❤️";
    btn.classList.remove("bas");
    void btn.offsetWidth;
    btn.classList.add("bas");
  }
  const {error} = acik
    ? await sb.from("hikaye_begeniler").delete().eq("hikaye_id", id).eq("user_id", st.kullanici.id)
    : await sb.from("hikaye_begeniler").insert({hikaye_id: id, user_id: st.kullanici.id});
  if (error) {
    st.hbBegenen[id] = acik;
    if (btn) btn.textContent = acik ? "❤️" : "🤍";
    toast("Beğeni kaydedilemedi: " + error.message);
  }
}

/* ---------- Yorum paneli (gönderi ve reels; alt kayar pencere) ---------- */
function ypCfg(tur) {
  return tur === "reel"
    ? {yt: "reel_yorumlar", fk: "reel_id", bt: "reel_yorum_begeniler"}
    : {yt: "yorumlar", fk: "gonderi_id", bt: "yorum_begeniler"};
}

async function yorumPanelAc(tur, id) {
  if (!sb || !st.kullanici) { toast("Yorumlar için giriş yapmalısın"); return; }
  st.yp = {tur: tur, id: Number(id), ust: null};
  st.ypVeri = {liste: [], begeniler: []};
  st.ypBasan = null;
  const panel = document.getElementById("yorumPanel");
  panel.innerHTML = `
    <div class="absolute inset-0 bg-black/60" data-act="ypKapat"></div>
    <div class="absolute inset-x-0 bottom-0 top-14 flex flex-col bg-[#0d0818] rounded-t-3xl border-t border-white/10 giris">
      <div class="mx-auto w-10 h-1 rounded-full bg-white/20 mt-2"></div>
      <div class="flex items-center justify-between px-5 py-3 border-b border-white/10">
        <h2 class="font-black">Yorumlar <span id="ypSayi" class="text-sm font-normal text-slate-400"></span></h2>
        <button data-act="ypKapat" class="text-xl px-1" aria-label="Kapat">✕</button>
      </div>
      <div id="ypListe" class="flex-1 overflow-y-auto px-5 py-3 space-y-4"><p class="text-center text-slate-400 py-10 text-sm">Yükleniyor…</p></div>
      <div class="border-t border-white/10 px-4 pt-2 pb-4 space-y-2 bg-[#0d0818]">
        <div id="ypChip" class="hidden"></div>
        <div class="flex gap-2">
          <input id="ypMetin" maxlength="150" placeholder="Yorum yaz…" class="flex-1 bg-white/5 border border-white/10 rounded-full px-4 py-2.5 text-sm outline-none focus:border-cyan-400">
          <button data-act="ypGonder" class="px-4 rounded-full bg-cyan-400 text-black font-bold text-sm">Gönder</button>
        </div>
      </div>
    </div>`;
  panel.classList.remove("hidden");
  await ypYukle();
}

function ypKapat() {
  const panel = document.getElementById("yorumPanel");
  if (panel) { panel.classList.add("hidden"); panel.innerHTML = ""; }
  st.yp = null;
}

async function ypYukle() {
  if (!st.yp) return;
  const cfg = ypCfg(st.yp.tur);
  const {data} = await sb.from(cfg.yt).select("id,ust_id,user_id,yazar,metin,created_at").eq(cfg.fk, st.yp.id).order("created_at", {ascending: true}).limit(300);
  const liste = data || [];
  let begeniler = [];
  if (liste.length) {
    const {data: bd} = await sb.from(cfg.bt).select("yorum_id,user_id").in("yorum_id", liste.map(y => y.id));
    begeniler = bd || [];
  }
  if (!st.yp) return;
  st.ypVeri = {liste, begeniler};
  ypCiz();
}

function ypCiz() {
  const kutu = document.getElementById("ypListe");
  if (!kutu || !st.yp) return;
  const {liste, begeniler} = st.ypVeri;
  const benim = st.kullanici.id;
  const satir = (y, cevap) => {
    const b = begeniler.filter(x => x.yorum_id === y.id);
    const ben = b.some(x => x.user_id === benim);
    return `
      <div class="flex gap-3 ${cevap ? "ml-10" : ""}">
        <div class="w-8 h-8 rounded-full shrink-0 flex items-center justify-center text-xs font-black" style="background:${dbGrad(y.user_id || "x")}">${esc((y.yazar || "?")[0])}</div>
        <div class="flex-1 min-w-0" data-act="ypYanitAc" data-id="${y.id}">
          <p class="text-sm"><span class="font-semibold">${esc(y.yazar || "Kullanıcı")}</span> ${esc(y.metin)}</p>
          <p class="text-[11px] text-slate-500 mt-0.5">${zamanYaz(y.created_at)} · <span class="text-slate-400">Yanıt ver</span></p>
        </div>
        <button data-act="ypBegen" data-id="${y.id}" class="flex flex-col items-center shrink-0 px-1" aria-label="Beğen">
          <span class="inline-block text-base ${st.ypBasan == y.id ? "kalp bas" : ""}">${ben ? "❤️" : "🤍"}</span>
          <span class="text-[10px] text-slate-400">${b.length || ""}</span>
        </button>
      </div>`;
  };
  const ustler = liste.filter(y => !y.ust_id);
  const cevaplar = liste.filter(y => y.ust_id);
  kutu.innerHTML = ustler.length
    ? ustler.map(y => satir(y, false) + cevaplar.filter(c => c.ust_id === y.id).map(c => satir(c, true)).join("")).join("")
    : '<p class="text-center text-slate-400 py-10 text-sm">Henüz yorum yok. İlk yorumu sen yaz.</p>';
  document.getElementById("ypSayi").textContent = liste.length ? "· " + liste.length : "";
}

// Yoruma dokununca yanıt modu
function ypYanitAc(id) {
  if (!st.yp) return;
  const y = st.ypVeri.liste.find(x => x.id == id);
  if (!y) return;
  const ust = y.ust_id || y.id;
  const hedef = st.ypVeri.liste.find(x => x.id == ust);
  st.yp.ust = ust;
  const chip = document.getElementById("ypChip");
  chip.className = "flex items-center justify-between text-xs text-cyan-300 bg-cyan-400/10 rounded-full px-3 py-1.5";
  chip.innerHTML = `<span>${esc(hedef ? hedef.yazar : y.yazar)} kişisine yanıt veriliyor</span><button data-act="ypYanitIptal" class="px-1 text-slate-300" aria-label="Yanıtı iptal et">✕</button>`;
  document.getElementById("ypMetin").focus();
}

function ypYanitIptal() {
  if (st.yp) st.yp.ust = null;
  const chip = document.getElementById("ypChip");
  if (chip) { chip.className = "hidden"; chip.innerHTML = ""; }
}

async function ypGonder() {
  if (!st.yp || !sb || !st.kullanici) return;
  const inp = document.getElementById("ypMetin");
  const t = inp ? inp.value.trim().slice(0, 150) : "";
  if (!t) return;
  const tur = st.yp.tur;
  const cfg = ypCfg(tur);
  const satir = {[cfg.fk]: st.yp.id, yazar: BEN.ad, metin: t};
  if (st.yp.ust) satir.ust_id = st.yp.ust;
  const {error} = await sb.from(cfg.yt).insert(satir);
  if (error) { toast("Yorum gönderilemedi: " + error.message); return; }
  if (tur === "gonderi") {
    const g = st.dbGonderiler.find(x => x.id == st.yp.id);
    if (g && g.sahip && g.sahip !== st.kullanici.id) await sb.from("bildirimler").insert({alici: g.sahip, tur: "yorum", metin: BEN.ad + " gönderine yorum yaptı: " + t.slice(0, 40)});
    const ust = st.yp.ust ? st.ypVeri.liste.find(x => x.id == st.yp.ust) : null;
    if (ust && ust.user_id && ust.user_id !== st.kullanici.id) await sb.from("bildirimler").insert({alici: ust.user_id, tur: "yanit", metin: BEN.ad + " yorumunuza yanıt verdi: " + t.slice(0, 60)});
  }
  inp.value = "";
  ypYanitIptal();
  await ypYukle();
  if (tur === "gonderi") gonderiYukle();
  if (tur === "reel") { await reelEtkilesimYukle(); reelsAc(); }
}

// Yorum beğenisi: anında kalp, sunucuya yazılır
async function ypBegen(id) {
  if (!st.yp || !sb || !st.kullanici) return;
  const cfg = ypCfg(st.yp.tur);
  const cid = Number(id);
  const ben = st.ypVeri.begeniler.some(x => x.yorum_id === cid && x.user_id === st.kullanici.id);
  const {error} = ben
    ? await sb.from(cfg.bt).delete().eq("yorum_id", cid).eq("user_id", st.kullanici.id)
    : await sb.from(cfg.bt).insert({yorum_id: cid});
  if (error) { toast("Beğeni kaydedilemedi: " + error.message); return; }
  st.ypBasan = ben ? null : cid;
  setTimeout(() => { st.ypBasan = null; }, 700);
  await ypYukle();
}

/* ---------- Reels etkileşimi (sunucu): beğeni ve yorum sayısı ---------- */
async function reelEtkilesimYukle() {
  if (!sb || !st.kullanici || !st.dbReeller.length) return;
  const ids = st.dbReeller.map(r => r.id);
  const [begRes, yorRes] = await Promise.all([
    sb.from("reel_begeniler").select("reel_id,user_id").in("reel_id", ids),
    sb.from("reel_yorumlar").select("reel_id").in("reel_id", ids)
  ]);
  const benim = st.kullanici.id;
  const begeniler = begRes.data || [];
  const yorumlar = yorRes.data || [];
  st.dbReeller.forEach(r => {
    const b = begeniler.filter(x => x.reel_id === r.id);
    r.begeni = b.length;
    r.begendim = b.some(x => x.user_id === benim);
    r.yorumSayi = yorumlar.filter(x => x.reel_id === r.id).length;
  });
}

async function reelBegenIsle(i) {
  const r = reelListe()[i];
  if (!r) return;
  if (!r.db || !sb || !st.kullanici) {
    r.begendim = !r.begendim;
    r.begeni = (r.begeni || 0) + (r.begendim ? 1 : -1);
    reelsAc();
    return;
  }
  const acik = r.begendim;
  r.begendim = !acik;
  r.begeni = (r.begeni || 0) + (acik ? -1 : 1);
  reelsAc();
  const {error} = acik
    ? await sb.from("reel_begeniler").delete().eq("reel_id", r.id).eq("user_id", st.kullanici.id)
    : await sb.from("reel_begeniler").insert({reel_id: r.id});
  if (error) {
    r.begendim = acik;
    r.begeni = (r.begeni || 0) + (acik ? 1 : -1);
    reelsAc();
    toast("Beğeni kaydedilemedi: " + error.message);
  }
}

/* ---------- Gizli hesap: takip istekleri ---------- */
// Gizli hesaba "Takip et" bir istek oluşturur; takipçi kaydı yalnızca onayla oluşur
async function takipIstekGonder(id) {
  const {error} = await sb.from("takip_istekleri").insert({istek_eden: st.kullanici.id, hedef: id});
  if (error) { toast("İstek gönderilemedi: " + error.message); return false; }
  await sb.from("bildirimler").insert({alici: id, tur: "takip_istegi", metin: BEN.ad + " seni takip etmek istiyor"});
  toast("Takip isteği gönderildi ⏳");
  await takipVerileriYukle();
  return true;
}

async function takipIstekIptal(id) {
  const {error} = await sb.from("takip_istekleri").delete().eq("istek_eden", st.kullanici.id).eq("hedef", id);
  if (error) { toast("İptal edilemedi: " + error.message); return; }
  toast("İstek iptal edildi");
  await takipVerileriYukle();
  if (document.querySelector('[data-kisi="' + id + '"]')) profilGor(id);
  else if (document.querySelector('[data-liste="1"]')) takipListeAc(st.listeTur);
}

// Görseli 600 px'e küçültüp JPEG olarak döndürür (veritabanına satır olarak yazılır)
function gorselKucult(dosya, maks) {
  return new Promise((ok, hata) => {
    const img = new Image();
    img.onload = () => {
      const oran = Math.min(1, maks / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * oran);
      c.height = Math.round(img.height * oran);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      ok(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => hata(new Error("görsel okunamadı"));
    img.src = URL.createObjectURL(dosya);
  });
}

// 2s, 1g gibi kısa zaman
function zamanKisa(t) {
  const dk = Math.floor((Date.now() - t) / 60000);
  if (dk < 1) return "şimdi";
  if (dk < 60) return dk + "dk";
  const sa = Math.floor(dk / 60);
  if (sa < 24) return sa + "s";
  return Math.floor(sa / 24) + "g";
}

// Bugünden geriye doğru gün (YYYY-AA-GG)

// Hesaplar bu cihazda saklanır; oturum belirteçleri yalnızca bu tarayıcıda tutulur
function hesapListesi() {
  try { const v = JSON.parse(localStorage.getItem("vm_hesaplar") || "[]"); return Array.isArray(v) ? v : []; } catch (err) { return []; }
}

function hesapYaz(liste) {
  try { localStorage.setItem("vm_hesaplar", JSON.stringify(liste.slice(0, 5))); } catch (err) {}
}

function hesapKaydet(session) {
  const u = session.user;
  const liste = hesapListesi();
  const kayit = {
    id: u.id,
    email: u.email || "",
    ad: (u.user_metadata && u.user_metadata.ad) || (u.email || "").split("@")[0],
    access: session.access_token,
    refresh: session.refresh_token
  };
  const i = liste.findIndex(h => String(h.id) === String(u.id));
  if (i >= 0) liste[i] = kayit; else liste.push(kayit);
  hesapYaz(liste);
}

function hesapSil(id) {
  hesapYaz(hesapListesi().filter(h => String(h.id) !== String(id)));
}

async function dbPaylas(id) {
  const g = st.dbGonderiler.find(x => x.id == id);
  if (!g) return;
  const url = location.href.split("#")[0];
  const metin = (g.yazar + ": " + (g.metin || "Gönderi")).slice(0, 100);
  if (navigator.share) {
    try { await navigator.share({title: "VibeMatch", text: metin, url}); return; } catch (err) { if (err && err.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); toast("Bağlantı kopyalandı 🔗"); }
  catch (err) { toast("Paylaşılamadı"); }
}

        <button data-act="gonderiDuzenle" data-id="${id}" class="py-3 rounded-full bg-white/10 font-semibold">✏️ Düzenle</button>
        <button data-act="begeniGizle" data-id="${id}" class="py-3 rounded-full bg-white/10 font-semibold">${g.begeniGizli ? "👁️ Beğenileri göster" : "🙈 Beğenileri gizle"}</button>
        <button data-act="yorumKapat" data-id="${id}" class="py-3 rounded-full bg-white/10 font-semibold">${g.yorumKapali ? "💬 Yorumları aç" : "🚫 Yorumları kapat"}</button>
        <button data-act="gonderiSilMenu" data-id="${id}" class="py-3 rounded-full border border-rose-400 text-rose-300 font-semibold">🗑️ Sil</button>`
        : `<button data-act="dbPaylas" data-id="${id}" class="py-3 rounded-full bg-white/10 font-semibold">🔗 Bağlantıyı paylaş</button>`}
      <button data-act="modalKapat" class="text-sm text-slate-400">Kapat</button>
    </div>`);
}

function gonderiDuzenle(id) {
  const g = st.dbGonderiler.find(x => x.id == id);
  if (!g || !g.benim) return;
  modalAc(`
    <div class="h-full bg-[#0d0818] p-6 giris">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-black">Gönderiyi düzenle</h2>
        <button data-act="modalKapat" class="kapat-tus" aria-label="Kapat">✕</button>
      </div>
      <textarea id="duzMetin" maxlength="180" rows="5" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-sm outline-none focus:border-cyan-400 resize-none">${esc(g.metin)}</textarea>
      <button data-act="gonderiDuzenleKaydet" data-id="${id}" class="w-full mt-3 py-2.5 rounded-full bg-gradient-to-r from-pink-500 to-cyan-400 font-bold text-sm">Kaydet</button>
    </div>`);
}

async function gonderiDuzenleKaydet(id) {
  if (!sb || !st.kullanici) return;
  const metin = ((document.getElementById("duzMetin") || {}).value || "").slice(0, 180);
  const {data, error} = await sb.from("gonderiler").update({metin}).eq("id", id).eq("user_id", st.kullanici.id).select("id");
  if (error || !data || !data.length) { toast("Düzenlenemedi: " + (error ? error.message : "yetki yok")); return; }
  modalKapat();
  toast("Gönderi güncellendi ✏️");
  gonderiYukle();
}

async function begeniGizle(id) {
  const g = st.dbGonderiler.find(x => x.id == id);
  if (!g || !g.benim || !sb) return;
  const yeni = !g.begeniGizli;
  const {data, error} = await sb.from("gonderiler").update({begeni_gizli: yeni}).eq("id", id).eq("user_id", st.kullanici.id).select("id");
  if (error || !data || !data.length) { toast("Ayar kaydedilemedi: " + (error ? error.message : "yetki yok")); return; }
  modalKapat();
  toast(yeni ? "Beğeni sayısı gizlendi 🙈" : "Beğeni sayısı gösteriliyor");
  gonderiYukle();
}

/* ---------- Hikaye arşivi ve öne çıkanlar (Highlights, sunucuda) ---------- */

// Kendi arşivini ve highlight'larını sunucudan yükler
async function highlightYukle() {
  if (!sb || !st.kullanici) return;
  const benim = st.kullanici.id;
  try { await sb.rpc("hikaye_arsivle"); } catch (err) {}
  const {data: arsiv} = await sb.from("hikayeler").select("id,foto,created_at,is_archived").eq("user_id", benim).order("created_at", {ascending: false}).limit(200);
  st.dbArsiv = arsiv || [];
  const {data: hl, error} = await sb.from("highlights").select("id,ad,created_at,kapak_hikaye_id,kapak_foto,highlight_hikayeler(hikayeler(id,foto,created_at))").eq("user_id", benim).order("created_at", {ascending: true});
  if (error) return; // highlight tabloları henüz kurulmadıysa sessizce geç
  st.dbHighlight = (hl || []).map(h => ({
    id: h.id,
    ad: h.ad,
    kapakId: h.kapak_hikaye_id,
    kapakFoto: h.kapak_foto || ((st.dbArsiv || []).find(x => x.id === h.kapak_hikaye_id) || {}).foto,
    hikayeler: (h.highlight_hikayeler || []).map(x => x.hikayeler).filter(Boolean)
      .map(s => ({id: s.id, foto: s.foto, t: s.created_at}))
      .sort((a, b) => (a.t < b.t ? -1 : 1)),
  })).filter(h => h.hikayeler.length);
  if (st.sekme === "profil") render();
}

// Profilde avatar altındaki yatay highlight çemberleri
function oneCikanHTML() {
  const liste = st.dbHighlight || [];
  if (!liste.length) return "";
  return `<div class="flex gap-4 overflow-x-auto kaydir mt-4 pb-1">${liste.map((h, i) => `
    <button data-act="hlAc" data-i="${i}" class="flex flex-col items-center gap-1 shrink-0">
      <span class="w-16 h-16 rounded-full overflow-hidden border border-white/20 bg-white/5">${(h.kapakFoto || (h.hikayeler[0] && h.hikayeler[0].foto)) ? `<img src="${h.kapakFoto || h.hikayeler[0].foto}" class="w-full h-full object-cover">` : ""}</span>
      <span class="text-[10px] text-slate-400 w-16 truncate text-center">${esc(h.ad)}</span>
    </button>`).join("")}</div>`;
}

// Hikaye arşivi: seçip yeni highlight oluştur veya mevcut highlight'a ekle
async function arsivAc() {
  if (!sb || !st.kullanici) { toast("Arşiv için giriş yapmalısın"); return; }
  modalAc(`<div class="h-full bg-[#0d0818] p-6 giris"><p class="text-center text-xs text-slate-500 py-8">Yükleniyor…</p></div>`);
  await highlightYukle();
  arsivCiz();
}

function arsivCiz(ad) {
  const liste = st.dbArsiv || [];
  const secim = st.arsivSecim || [];
  const hlSecenek = `<option value="yeni">+ Yeni highlight</option>` + (st.dbHighlight || []).map(h => `<option value="${h.id}">${esc(h.ad)}</option>`).join("");
  const icerik = liste.length
    ? `<div class="grid grid-cols-3 gap-1">${liste.map(h => `
         <button data-act="arsivSec" data-id="${h.id}" class="relative aspect-[9/16] overflow-hidden rounded-lg bg-white/5">
           <img src="${h.foto}" class="w-full h-full object-cover">
           ${secim.includes(h.id) ? `<span class="absolute top-1 right-1 w-6 h-6 rounded-full bg-cyan-400 text-black text-xs font-black flex items-center justify-center">✓</span>` : ""}
           ${h.is_archived ? "" : `<span class="absolute bottom-1 left-1 text-[9px] bg-black/60 px-1 rounded">Aktif</span>`}
         </button>`).join("")}</div>
       <div class="mt-5 space-y-2">
         <p class="text-xs text-slate-400">${secim.length} hikaye seçili · Aktif hikayeler 24 saat sonra arşive düşer</p>
         <select id="hlHedef" class="w-full bg-white/5 border border-white/10 rounded-full px-4 py-2 text-sm outline-none">${hlSecenek}</select>
         <input id="hlAd" maxlength="30" value="${esc(ad || "")}" placeholder="Yeni highlight adı" class="w-full bg-white/5 border border-white/10 rounded-full px-4 py-2 text-sm outline-none focus:border-cyan-400">
         <button data-act="arsivEkle" class="w-full py-2.5 rounded-full bg-gradient-to-r from-pink-500 to-cyan-400 font-bold text-sm">Seçilenleri öne çıkar</button>
       </div>`
    : `<p class="text-center text-slate-400 py-10">Arşivde henüz hikaye yok. Hikaye paylaştıkça burada görünür.</p>`;
  modalAc(`
    <div class="h-full bg-[#0d0818] overflow-y-auto p-6 giris">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-xl font-black">Hikaye arşivi</h2>
        <button data-act="modalKapat" class="kapat-tus" aria-label="Kapat">✕</button>
      </div>
      ${icerik}
    </div>`);
  const ara = document.getElementById("hlHedef");
  if (ara && st.hlSecilenHedef) ara.value = st.hlSecilenHedef;
}

function arsivSec(id) {
  const n = Number(id);
  const ad = (document.getElementById("hlAd") || {}).value;
  const hedef = (document.getElementById("hlHedef") || {}).value;
  st.arsivSecim = st.arsivSecim || [];
  st.arsivSecim = st.arsivSecim.includes(n) ? st.arsivSecim.filter(x => x !== n) : [...st.arsivSecim, n];
  st.hlSecilenHedef = hedef;
  arsivCiz(ad);
}

async function arsivEkle() {
  if (!sb || !st.kullanici) return;
  const secim = (st.arsivSecim || []).slice();
  if (!secim.length) { toast("Önce en az bir hikaye seç"); return; }
  const hedef = (document.getElementById("hlHedef") || {}).value || "yeni";
  let hid = hedef;
  if (hedef === "yeni") {
    const ad = ((document.getElementById("hlAd") || {}).value || "").trim();
    if (!ad) { toast("Highlight adı yaz"); return; }
    const {data, error} = await sb.from("highlights").insert({user_id: st.kullanici.id, ad: ad.slice(0, 30)}).select("id").single();
    if (error) { toast("Highlight oluşturulamadı: " + error.message); return; }
    hid = data.id;
  }
  const satirlar = secim.map(s => ({highlight_id: Number(hid), hikaye_id: s}));
  const {error} = await sb.from("highlight_hikayeler").upsert(satirlar, {onConflict: "highlight_id,hikaye_id", ignoreDuplicates: true});
  if (error) { toast("Eklenemedi: " + error.message); return; }
  st.arsivSecim = [];
  st.hlSecilenHedef = null;
  toast("Öne çıkarıldı ⭐");
  await highlightYukle();
  arsivCiz();
  render();
}

// Highlight oynatıcısı
function highlightAc(i) {
  const h = (st.dbHighlight || [])[i];
  if (!h || !h.hikayeler.length) return;
  st.hlAktif = i;
  st.hlSira = 0;
  st.hlAcik = true;
  hlGoster();
}

function hlGoster() {
  const h = (st.dbHighlight || [])[st.hlAktif];
  if (!h || !st.hlAcik) { hlKapat(); return; }
  if (st.hlSira >= h.hikayeler.length) { hlKapat(); return; }
  const s = h.hikayeler[st.hlSira];
  modalAc(`
    <div class="relative w-full h-full bg-black overflow-hidden">
      <img src="${s.foto}" class="absolute inset-0 w-full h-full object-contain">
      <div class="absolute top-3 left-3 right-3 flex gap-1 z-10">${h.hikayeler.map((_, k) => `<div class="flex-1 h-0.5 rounded bg-white/30 overflow-hidden"><div class="h-full bg-white" style="width:${k < st.hlSira ? 100 : 0}%"></div></div>`).join("")}</div>
      <div class="absolute top-7 left-4 z-10 font-semibold">${esc(h.ad)}</div>
      <button data-act="hlGecis" data-y="-1" class="absolute left-0 top-0 bottom-24 w-1/3 z-0" aria-label="Önceki"></button>
      <button data-act="hlGecis" data-y="1" class="absolute right-0 top-0 bottom-24 w-2/3 z-0" aria-label="Sonraki"></button>
        <button data-act="hlKapat" class="absolute top-7 right-3 z-10 text-xl px-2" aria-label="Kapat">✕</button>
        <button data-act="hlMenuAc" data-hid="${h.id}" class="absolute bottom-6 right-4 z-10 w-10 h-10 rounded-full bg-black/60 text-xl flex items-center justify-center" aria-label="Seçenekler">⋯</button>
      </div>
    </div>`);
  clearTimeout(st.hlZ);
  st.hlZ = setTimeout(() => {
    if (st.hlAcik && document.querySelector('[data-act="hlGecis"]')) hlGecis(1);
  }, 5000);
}

// Highlight'ı kimliğiyle bulur
function hlBul(hid) {
  return (st.dbHighlight || []).find(x => x.id == hid) || null;
}

// Alt sayfa (bottom sheet): Düzenle · Kapak · Sil
function hlMenuAc(hid) {
  const h = hlBul(hid);
  if (!h) return;
  clearTimeout(st.hlZ);
  st.hlAcik = false;
  modalAc(`
    <div class="absolute inset-0 bg-black/60" data-act="modalKapat"></div>
    <div class="absolute left-0 right-0 bottom-0 bg-[#0d0818] rounded-t-3xl p-5 pb-8 giris border-t border-white/10 space-y-2">
      <div class="mx-auto w-10 h-1 rounded-full bg-white/20 mb-3"></div>
      <p class="text-center text-sm font-bold">${esc(h.ad)}</p>
      <button data-act="hlDuzenle" data-hid="${h.id}" class="w-full py-3 rounded-xl bg-white/10 font-semibold text-sm">✏️ Öne çıkarılanı düzenle</button>
      <button data-act="hlKapakSec" data-hid="${h.id}" class="w-full py-3 rounded-xl bg-white/10 font-semibold text-sm">🖼️ Kapak fotoğrafını değiştir</button>
      <button data-act="hlSilTum" data-hid="${h.id}" class="w-full py-3 rounded-xl border border-rose-400 text-rose-300 font-semibold text-sm">🗑️ Sil (hikayeler arşivde kalır)</button>
      <button data-act="modalKapat" class="w-full py-2 text-sm text-slate-400">Vazgeç</button>
    </div>`);
}

// Basılı tutma: profildeki çemberde 500 ms
let hlBasiliZ = null;
document.addEventListener("pointerdown", e => {
  const el = e.target.closest('[data-act="hlAc"]');
  if (!el) return;
  st.hlUzun = false;
  clearTimeout(hlBasiliZ);
  hlBasiliZ = setTimeout(() => {
    st.hlUzun = true;
    const h = (st.dbHighlight || [])[+el.dataset.i];
    if (h) hlMenuAc(h.id);
  }, 500);
});
["pointerup", "pointercancel"].forEach(t => document.addEventListener(t, () => clearTimeout(hlBasiliZ)));

// Düzenleme: ad, hikaye ekle/çıkar
function hlDuzenle(hid) {
  const h = hlBul(hid);
  if (!h) return;
  const dahil = new Set(h.hikayeler.map(x => x.id));
  const disarda = (st.dbArsiv || []).filter(x => !dahil.has(x.id));
  modalAc(`
    <div class="h-full bg-[#0d0818] overflow-y-auto p-6 giris">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-black">Öne çıkarılanı düzenle</h2>
        <button data-act="modalKapat" class="kapat-tus" aria-label="Kapat">✕</button>
      </div>
      <label class="text-xs text-slate-400">Ad</label>
      <div class="flex gap-2 mt-1 mb-5">
        <input id="hlAdDuz" maxlength="30" value="${esc(h.ad)}" class="flex-1 bg-white/5 border border-white/10 rounded-full px-4 py-2 text-sm outline-none focus:border-cyan-400">
        <button data-act="hlAdKaydet" data-hid="${h.id}" class="px-4 rounded-full bg-cyan-400 text-black font-bold text-sm">Kaydet</button>
      </div>
      <p class="text-xs text-slate-400 mb-2">Bu öne çıkarılandaki hikayeler (${h.hikayeler.length})</p>
      <div class="grid grid-cols-3 gap-1 mb-5">${h.hikayeler.map(x => `
        <div class="relative aspect-[9/16] rounded-lg overflow-hidden">
          <img src="${x.foto}" class="w-full h-full object-cover">
          <button data-act="hlCikar" data-hid="${h.id}" data-id="${x.id}" class="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/70 text-xs" aria-label="Çıkar">✕</button>
        </div>`).join("")}</div>
      <p class="text-xs text-slate-400 mb-2">Eklenebilecek hikayeler</p>
      ${disarda.length ? `<div class="grid grid-cols-3 gap-1">${disarda.map(x => `
        <button data-act="hlEkle" data-hid="${h.id}" data-id="${x.id}" class="aspect-[9/16] rounded-lg overflow-hidden"><img src="${x.foto}" class="w-full h-full object-cover"></button>`).join("")}</div>`
        : `<p class="text-xs text-slate-500">Arşivde eklenebilecek başka hikaye yok.</p>`}
    </div>`);
}

async function hlAdKaydet(hid) {
  if (!sb || !st.kullanici) return;
  const ad = ((document.getElementById("hlAdDuz") || {}).value || "").trim().slice(0, 30);
  if (!ad) { toast("Ad boş olamaz"); return; }
  const {data, error} = await sb.from("highlights").update({ad}).eq("id", hid).eq("user_id", st.kullanici.id).select("id");
  if (error || !data || !data.length) { toast("Kaydedilemedi: " + (error ? error.message : "yetki yok")); return; }
  toast("Ad güncellendi ✏️");
  await highlightYukle();
  hlDuzenle(hid);
  render();
}

// Hikaye çıkar; son hikaye de çıkarılırsa öne çıkarılan silinir
async function hlCikar(hid, sid) {
  if (!sb || !st.kullanici) return;
  const {error} = await sb.from("highlight_hikayeler").delete().eq("highlight_id", Number(hid)).eq("hikaye_id", Number(sid));
  if (error) { toast("Çıkarılamadı: " + error.message); return; }
  const {data: kalan} = await sb.from("highlight_hikayeler").select("hikaye_id").eq("highlight_id", Number(hid));
  if (!kalan || !kalan.length) {
    await sb.from("highlights").delete().eq("id", Number(hid)).eq("user_id", st.kullanici.id);
    await highlightYukle();
    modalKapat();
    toast("Öne çıkarılan silindi");
    render();
    return;
  }
  await highlightYukle();
  hlDuzenle(hid);
  render();
}

async function hlEkle(hid, sid) {
  if (!sb || !st.kullanici) return;
  const {error} = await sb.from("highlight_hikayeler").upsert([{highlight_id: Number(hid), hikaye_id: Number(sid)}], {onConflict: "highlight_id,hikaye_id", ignoreDuplicates: true});
  if (error) { toast("Eklenemedi: " + error.message); return; }
  await highlightYukle();
  hlDuzenle(hid);
  render();
}

// Kapak: arşivdeki herhangi bir hikaye
function hlKapakSec(hid) {
  const h = hlBul(hid);
  if (!h) return;
  const liste = st.dbArsiv || [];
  modalAc(`
    <div class="h-full bg-[#0d0818] overflow-y-auto p-6 giris">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-black">Kapak fotoğrafı</h2>
        <button data-act="modalKapat" class="kapat-tus" aria-label="Kapat">✕</button>
      </div>
      <button data-act="hlKapakDosya" data-hid="${h.id}" class="w-full mb-5 py-3 rounded-xl bg-white/10 font-semibold text-sm text-white">📁 Galeriden fotoğraf seç</button>
      ${liste.length ? `<div class="grid grid-cols-3 gap-1">${liste.map(x => `
        <button data-act="hlKapakKaydet" data-hid="${h.id}" data-id="${x.id}" class="relative aspect-[9/16] rounded-lg overflow-hidden">
          <img src="${x.foto}" class="w-full h-full object-cover">
          ${h.kapakId == x.id ? `<span class="absolute top-1 left-1 text-[10px] bg-cyan-400 text-black font-bold px-1 rounded">Kapak</span>` : ""}
        </button>`).join("")}</div>` : `<p class="text-center text-slate-400 py-10">Kapak için hikaye yok.</p>`}
    </div>`);
}

async function hlKapakKaydet(hid, sid) {
  if (!sb || !st.kullanici) return;
  const {data, error} = await sb.from("highlights").update({kapak_hikaye_id: Number(sid), kapak_foto: null}).eq("id", Number(hid)).eq("user_id", st.kullanici.id).select("id");
  if (error || !data || !data.length) { toast("Kapak kaydedilemedi: " + (error ? error.message : "yetki yok")); return; }
  toast("Kapak güncellendi 🖼️");
  await highlightYukle();
  modalKapat();
  render();
}

async function hlSilTum(hid) {
  if (!sb || !st.kullanici) return;
  if (!confirm("Bu öne çıkarılan silinsin mi? Hikayeler arşivde kalır.")) return;
  const {data, error} = await sb.from("highlights").delete().eq("id", Number(hid)).eq("user_id", st.kullanici.id).select("id");
  if (error || !data || !data.length) { toast("Silinemedi: " + (error ? error.message : "yetki yok")); return; }
  modalKapat();
  toast("Öne çıkarılan silindi");
  await highlightYukle();
  render();
}

function hlGecis(y) {
  clearTimeout(st.hlZ);
  const h = (st.dbHighlight || [])[st.hlAktif];
  if (!h) return;
  st.hlSira += y;
  if (st.hlSira < 0) st.hlSira = 0;
  if (st.hlSira >= h.hikayeler.length) { hlKapat(); return; }
  hlGoster();
}

function hlKapat() {
  clearTimeout(st.hlZ);
  st.hlAcik = false;
  modalKapat();
}

// Hikayeyi highlight'tan çıkar; kalmazsa highlight'ı da sil

/* Gönderi için şarkı dosyası seçimi */
document.addEventListener('change', e => {
  if (e.target.id !== 'sesDosya') return;
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  st.bekleyenSes = f;
  toast('Şarkı eklendi 🎵 Paylaş deyince gönderiyle çalacak');
  render();
});

/* Kameradan çekilen dosya */
document.addEventListener('change', e => {
  if (e.target.id !== 'kameraDosya') return;
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (f.type.indexOf('video') === 0) { reelsDosyaIsle(f); return; }
  const r = new FileReader();
  r.onload = () => {
    st.bekleyenFoto = r.result;
    const b = document.querySelector('[data-act="fotoSec"]');
    if (b) b.textContent = '📷 Fotoğraf seçildi ✓';
    toast("Fotoğraf hazır, Paylaş düğmesine basabilirsin 📸");
  };
  r.readAsDataURL(f);
});

/* Reels dosyası seçimi */
document.addEventListener('change', e => {
  if (e.target.id !== 'reelsDosya') return;
  const f = e.target.files[0];
  e.target.value = '';
  if (f && document.getElementById('reelFormMetin')) { st.reelFormDosya = f; const url = URL.createObjectURL(f); const on = document.getElementById('reelFormOnizleme'); if (on) on.innerHTML = f.type.indexOf('video') === 0 ? '<video src="' + url + '" muted playsinline class="w-full h-full object-cover"></video>' : '<img src="' + url + '" class="w-full h-full object-cover">'; const ad = document.getElementById('reelFormDosyaAd'); if (ad) ad.textContent = f.name; return; }

});

/* Profil fotoğrafı: galeriden seçilir, 400px kare olarak küçültülüp saklanır */
document.addEventListener('change', e => {
  if (e.target.id !== 'profilDosya') return;
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    kirpAc(r.result);
    return;
    const img = new Image();
    img.onload = () => {
      const boyut = 400;
      const c = document.createElement('canvas');
      c.width = boyut; c.height = boyut;
      const k = Math.min(img.width, img.height);
      const sx = (img.width - k) / 2, sy = (img.height - k) / 2;
      c.getContext('2d').drawImage(img, sx, sy, k, k, 0, 0, boyut, boyut);
      st.benFoto = c.toDataURL('image/jpeg', 0.85);
      try { localStorage.setItem('vm_foto', st.benFoto); } catch (err) {}
      toast('Profil fotoğrafın güncellendi 📸');
      render();
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
  e.target.value = '';
});

function hataMetni(err) {
  const m = (err && err.message) || "";
  const k = m.toLowerCase();
  if (k.indexOf("password") !== -1 && (k.indexOf("least") !== -1 || k.indexOf("short") !== -1)) return "Şifre çok kısa. En az 6 karakter yazın.";

  if (k.indexOf("email rate limit") !== -1) return "Doğrulama e-postası gönderim sınırına ulaşıldı. Bir süre sonra tekrar dene.";
  if (k.indexOf("rate limit") !== -1 || k.indexOf("too many") !== -1) return "Çok fazla deneme yapıldı. Birkaç dakika sonra tekrar deneyin.";
  if (k.indexOf("invalid login") === 0) return "E-posta veya şifre hatalı. Hesabınız yoksa üstten Kayıt sekmesini seçin.";
  if (m.indexOf("Email not confirmed") === 0) return "Önce e-postanızdaki doğrulama bağlantısına tıklayın.";

/* Spotify veya YouTube bağlantısından gömülü oynatıcı adresi üretir */
function sarkiCoz(url) {
  const s = (url || "").trim();
  let m = s.match(/open\.spotify\.com\/(track|album|playlist)\/([A-Za-z0-9]+)/);
  if (m) return {embed: "https://open.spotify.com/embed/" + m[1] + "/" + m[2], kaynak: "spotify"};
  m = s.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/);
  if (m) return {embed: "https://www.youtube.com/embed/" + m[1], kaynak: "youtube"};
  return null;
}

/* ---------- Profil fotoğrafı kırpma ---------- */
const KIRP_BOYUT = 300;

function kirpCiz() {
  const c = document.getElementById("kirpCanvas");
  const img = st.kirpResim;
  if (!c || !img) return;
  const ctx = c.getContext("2d");
  const zoom = parseFloat(document.getElementById("kirpZoom").value);
  const kx = parseFloat(document.getElementById("kirpX").value);
  const ky = parseFloat(document.getElementById("kirpY").value);
  const taban = Math.max(KIRP_BOYUT / img.width, KIRP_BOYUT / img.height) * zoom;
  const dw = img.width * taban, dh = img.height * taban;
  const x = (KIRP_BOYUT - dw) / 2 + kx * Math.max(0, (dw - KIRP_BOYUT) / 2);
  const y = (KIRP_BOYUT - dh) / 2 + ky * Math.max(0, (dh - KIRP_BOYUT) / 2);
  ctx.clearRect(0, 0, KIRP_BOYUT, KIRP_BOYUT);
  ctx.drawImage(img, x, y, dw, dh);
}

function kirpAc(dataUrl) {
  const img = new Image();
  img.onload = () => {
    st.kirpResim = img;
    modalAc(`
      <div class="h-full bg-[#0d0818] overflow-y-auto p-6 giris">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-black">Fotoğrafı ayarla</h2>
          <button data-act="modalKapat" class="kapat-tus" aria-label="Kapat">✕</button>
        </div>
        <div class="flex justify-center mb-4">
          <canvas id="kirpCanvas" width="${KIRP_BOYUT}" height="${KIRP_BOYUT}" class="rounded-full border-2 border-cyan-400" style="width:${KIRP_BOYUT}px;max-width:100%;height:auto"></canvas>
        </div>
        <label class="text-xs text-slate-400">Yakınlaştırma</label>
        <input id="kirpZoom" type="range" min="1" max="3" step="0.05" value="1" class="w-full mb-3">
        <label class="text-xs text-slate-400">Yatay kaydırma</label>
        <input id="kirpX" type="range" min="-1" max="1" step="0.02" value="0" class="w-full mb-3">
        <label class="text-xs text-slate-400">Dikey kaydırma</label>
        <input id="kirpY" type="range" min="-1" max="1" step="0.02" value="0" class="w-full mb-5">
        <button data-act="kirpKaydet" class="w-full py-3 rounded-full bg-gradient-to-r from-pink-500 to-cyan-400 font-bold">Profil fotoğrafı yap</button>
      </div>`);
    kirpCiz();
  };
  img.src = dataUrl;
}

function kirpKaydet() {
  const img = st.kirpResim;
  if (!img) return;
  const c = document.createElement("canvas");
  c.width = 400; c.height = 400;
  const k = 400 / KIRP_BOYUT;
  const zoom = parseFloat(document.getElementById("kirpZoom").value);
  const kx = parseFloat(document.getElementById("kirpX").value);
  const ky = parseFloat(document.getElementById("kirpY").value);
  const taban = Math.max(KIRP_BOYUT / img.width, KIRP_BOYUT / img.height) * zoom;
  const dw = img.width * taban * k, dh = img.height * taban * k;
  const x = (400 - dw) / 2 + kx * Math.max(0, (dw - 400) / 2);
  const y = (400 - dh) / 2 + ky * Math.max(0, (dh - 400) / 2);
  c.getContext("2d").drawImage(img, x, y, dw, dh);
  st.benFoto = c.toDataURL("image/jpeg", 0.85);
  profilDbKaydet();
  try { localStorage.setItem("vm_foto", st.benFoto); } catch (err) {}
  st.kirpResim = null;
  modalKapat();
  toast("Profil fotoğrafın güncellendi 📸");
  render();
}

document.addEventListener("input", e => {
  if (e.target.id === "kirpZoom" || e.target.id === "kirpX" || e.target.id === "kirpY") kirpCiz();
});

/* ---------- Gerçek gönderiler (veritabanı) ---------- */
function zamanYaz(ts) {
  const d = (Date.now() - Date.parse(ts)) / 60000;
  if (d < 1) return "az önce";
  if (d < 60) return Math.floor(d) + " dk önce";
  if (d < 1440) return Math.floor(d / 60) + " sa önce";
  return Math.floor(d / 1440) + " gün önce";
}

async function gonderiYukle() {
  if (!sb || !st.kullanici) return;
  st.gonderiYuklendi = true;
  const benim = st.kullanici.id;
  const {data: gs} = await sb.from("gonderiler").select("id,user_id,yazar,sehir,metin,foto,fotolar,ses,created_at,begeni_gizli,yorum_kapali").order("created_at", {ascending: false}).limit(60);
  const ids = (gs || []).map(g => g.id);
  let begeniler = [], yorumlar = [], sayiMap = {}, begenAdlari = {};
  if (ids.length) {
    const b = await sb.from("begeniler").select("gonderi_id,user_id").in("gonderi_id", ids);
    begeniler = b.data || [];
    const y = await sb.from("yorumlar").select("id,gonderi_id,ust_id,user_id,yazar,metin,created_at").in("gonderi_id", ids).order("created_at", {ascending: true});
    yorumlar = y.data || [];
    const sayiRes = await sb.rpc("gonderi_begeni_sayilari", {idler: ids});
    (sayiRes.data || []).forEach(r => { sayiMap[r.gonderi_id] = r.sayi; });
    const bIds = [...new Set(begeniler.map(b => b.user_id))];
    if (bIds.length) {
      const {data: bp} = await sb.from("profiles").select("id,ad").in("id", bIds);
      (bp || []).forEach(p => { begenAdlari[p.id] = p.ad; });
    }
  }
  st.dbGonderiler = (gs || []).map(g => ({
    id: g.id, sahip: g.user_id, benim: g.user_id === benim, yazar: g.yazar || "Kullanıcı", sehir: g.sehir || "",
    metin: g.metin || "", foto: g.foto, fotolar: g.fotolar || (g.foto ? [g.foto] : []), ses: g.ses, grad: dbGrad(g.user_id), zaman: zamanYaz(g.created_at),
    begeni: sayiMap[g.id] || 0,
    begeniGizli: !!g.begeni_gizli,
    yorumKapali: !!g.yorum_kapali,
    begenenler: (g.user_id === benim) ? begeniler.filter(x => x.gonderi_id === g.id).map(x => begenAdlari[x.user_id] || "Kullanıcı") : [],
    begendim: begeniler.some(x => x.gonderi_id === g.id && x.user_id === benim),
    yorumlar: yorumlar.filter(y => y.gonderi_id === g.id),
  }));
  const {count: benimSayi} = await sb.from("gonderiler").select("id", {count: "exact", head: true}).eq("user_id", benim);
  st.benGonderiSayi = benimSayi || 0;
  await profilFotolariYukle((gs || []).map(g => g.user_id));
  if (sb && st.kullanici) {
    const {data: kay} = await sb.from("kaydedilenler").select("gonderi_id").eq("user_id", benim);
    st.kaydedilen = (kay || []).map(k => k.gonderi_id);
  }
  render();
}

async function dbGonderiPaylas(metin, foto, ses, fotolar) {

    if (hata) return toast("Şarkı yüklenemedi: " + hata.message);
    sesUrl = sb.storage.from("sesler").getPublicUrl(yol).data.publicUrl;

  const {error} = await sb.from("gonderiler").insert({yazar: BEN.ad, sehir: BEN.sehir, metin: metin || "", foto: foto || null, fotolar: fotolar && fotolar.length > 1 ? fotolar : null, ses: sesUrl, begeni_gizli: !!st.vBegeniGizli, yorum_kapali: !!st.vYorumKapali});
  if (error) return toast("Paylaşılamadı: " + error.message);
  toast("Paylaşıldı ✨");
  gonderiYukle();
}

  else {

  }
  gonderiYukle();
}

/* ---------- Reels (sunucu) ---------- */
async function reelYukle() {
  if (!sb || !st.kullanici) return;
  const {data} = await sb.from("reeller").select("id,user_id,yazar,metin,url,tip,sarki").order("created_at", {ascending: false}).limit(30);
  st.dbReeller = (data || []).map(r => ({db: true, id: r.id, benim: r.user_id === st.kullanici.id, yazar: r.yazar || "kullanici", metin: r.metin || "", url: r.url, tip: r.tip, sarki: r.sarki, begeni: 0, begendim: false}));
  await reelEtkilesimYukle();
}

async function reelYukleDosya(f, metin, sarki) {
  const tip = f.type.indexOf("video") === 0 ? "video" : "image";
  const yol = st.kullanici.id + "/" + Date.now() + "-" + f.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const {error} = await sb.storage.from("reels").upload(yol, f, {contentType: f.type});
  if (error) return toast("Yüklenemedi: " + error.message);
  const {data} = sb.storage.from("reels").getPublicUrl(yol);
  if (metin === undefined) { const girdi = document.getElementById("gonderiMetin"); metin = girdi ? girdi.value.trim().slice(0, 150) : ""; }
  const {error: e2} = await sb.from("reeller").insert({yazar: BEN.ad, metin: metin, url: data.publicUrl, tip: tip, sarki: sarki ? sarki.embed : null});
  if (e2) return toast("Kaydedilemedi: " + e2.message);
  toast("Reels yayında 🎬");
  reelYukle().then(() => reelsAc());
}

async function reelAc(id) {
  await reelYukle();
  const i = st.dbReeller.findIndex(r => r.id == id);
  if (i > 0) { const [r] = st.dbReeller.splice(i, 1); st.dbReeller.unshift(r); }
  reelsAc();
}

  modalAc(`

}

async function reelGonder(alici, reelId) {
  const {error} = await sb.from("mesajlar_db").insert({alici: alici, reel_id: reelId});

async function mesajYukle() {
  if (!sb || !st.kullanici) return;
  await dbKonusmaYukle();
  const {data} = await sb.from("mesajlar_db").select("id,gonderen,reel_id,created_at").eq("alici", st.kullanici.id).not("reel_id", "is", null).order("created_at", {ascending: false}).limit(20);
  const ids = [...new Set((data || []).map(m => m.gonderen))];
  const adlar = {};
  if (ids.length) {
    const {data: pr} = await sb.from("profiles").select("id,ad").in("id", ids);
    (pr || []).forEach(p => { adlar[p.id] = p.ad; });
  }
  st.dbMesajlar = (data || []).map(m => Object.assign({}, m, {gonderenAd: adlar[m.gonderen] || "Biri"}));
  render();
}

/* ---------- Gerçek mesajlaşma (veritabanı) ---------- */
async function dbKonusmaYukle() {
  if (!sb || !st.kullanici) return;
  const benim = st.kullanici.id;
  const {data} = await sb.from("mesajlar_db").select("gonderen,alici,metin,created_at").is("reel_id", null).or("gonderen.eq." + benim + ",alici.eq." + benim).order("created_at", {ascending: false}).limit(200);
  const gorulen = {};
  (data || []).forEach(m => {
    const diger = m.gonderen === benim ? m.alici : m.gonderen;
    if (!gorulen[diger]) gorulen[diger] = {id: diger, son: m.metin || "", zaman: m.created_at};
  });
  const ids = Object.keys(gorulen);
  const adlar = {};
  if (ids.length) {
    const {data: pr} = await sb.from("profiles").select("id,ad").in("id", ids);
    (pr || []).forEach(p => { adlar[p.id] = p.ad; });
  }
  st.dbKonusmalar = ids.map(id => Object.assign(gorulen[id], {ad: adlar[id] || "Kullanıcı"}));
}

async function dbSohbetYukle(diger) {
  if (!sb || !st.kullanici) return;
  const benim = st.kullanici.id;
  const {data} = await sb.from("mesajlar_db").select("id,gonderen,alici,metin,created_at").is("reel_id", null)
    .or("and(gonderen.eq." + benim + ",alici.eq." + diger + "),and(gonderen.eq." + diger + ",alici.eq." + benim + ")")
    .order("created_at", {ascending: true}).limit(200);
  st.dbSohbetMesajlar = data || [];
}

  }).join("");
}

  reelsAc();

/* Keşfet ızgarası: diğer kullanıcıların gerçek gönderileri (en çok beğenilen önce) */
function kesfetYukle() {
  const kutu = document.getElementById("aramaSonuc");
  if (!kutu) return;
  if (!sb) { kutu.innerHTML = '<p class="text-center text-xs text-slate-500 py-8">Sunucu bağlantısı yok.</p>'; return; }
  if (!st.gonderiYuklendi && st.kullanici) gonderiYukle(); // yüklenince ızgarayı yeniden çizer
  const liste = st.dbGonderiler.filter(g => !g.benim).sort((a, b) => (b.begeni - a.begeni) || (b.id - a.id));
  if (!liste.length) { kutu.innerHTML = '<p class="text-center text-xs text-slate-500 py-8">Henüz gönderi yok. Diğer kullanıcılar paylaştıkça burada görünecek.</p>'; return; }
  kutu.innerHTML = '<p class="text-[11px] text-slate-400 mb-2">Öne çıkan gönderiler</p><div class="grid grid-cols-3 gap-1">' + liste.map(g => {
    const foto = (g.fotolar && g.fotolar[0]) || g.foto;
    const icerik = foto
      ? `<img src="${foto}" class="w-full h-full object-cover" loading="lazy">`

}

  const liste = reelListe();

  const icerik = liste.length
    ? liste.map((r, i) => `
        <section class="h-full snap-start relative bg-black overflow-hidden">
          ${r.tip === "video"
            ? `<video src="${r.url}" autoplay muted loop playsinline class="absolute inset-0 w-full h-full object-cover" onclick="this.paused ? this.play() : this.pause()"></video>`

          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/30 pointer-events-none"></div>
          <div class="absolute right-3 bottom-28 flex flex-col items-center gap-5 text-white">
            <button data-act="reelBegen" data-i="${i}" class="flex flex-col items-center text-2xl">${r.begendim ? "❤️" : "🤍"}<span class="text-[11px] mt-0.5">${r.begeni || 0}</span></button>
            ${r.db ? `<button data-act="yorumPanelAc" data-tur="reel" data-id="${r.id}" class="flex flex-col items-center text-2xl" aria-label="Yorumlar">💬<span class="text-[11px] mt-0.5">${r.yorumSayi || 0}</span></button>` : ""}
            <button data-act="profilPaylas" class="flex flex-col items-center text-2xl">↗️<span class="text-[11px] mt-0.5">Paylaş</span></button>

            <button data-act="reelKaydet" data-i="${i}" class="flex flex-col items-center text-2xl">${r.kaydedildi ? "🔖" : "📑"}<span class="text-[11px] mt-0.5">Kaydet</span></button>
            <button onclick="reelSes(this)" class="flex flex-col items-center text-2xl" aria-label="Ses">🔇</button>
            <button class="text-2xl" aria-label="Diğer">⋯</button>
          </div>
          <div class="absolute left-4 right-20 bottom-4 text-white">
            <div class="flex items-center gap-2">
              <div class="w-9 h-9 rounded-full flex items-center justify-center font-black text-sm" style="background:${BEN.grad}">${esc((kullanici[0] || "s").toUpperCase())}</div>
              <span class="font-semibold text-sm">@${esc(String(kullanici).toLowerCase().replace(/\s+/g, ""))}</span>
            </div>
            ${r.metin ? `<p class="text-sm mt-2">${esc(r.metin)}</p>` : ""}
            ${r.sarki ? `<iframe src="${r.sarki}" class="w-full rounded-xl mt-2" height="80" frameborder="0" allow="autoplay; encrypted-media; clipboard-write" loading="lazy"></iframe>` : ""}
          </div>
        </section>`).join("")
    : `<div class="h-full flex flex-col items-center justify-center text-center text-slate-400 p-6 gap-3">
         <div class="text-5xl">🎬</div>
         <div>Henüz reels yok</div>
         <button data-act="reelsEkle" class="px-4 py-2 rounded-full bg-cyan-400 text-black font-bold text-sm">Reels ekle</button>
       </div>`;
  modalAc(`
    <div class="h-full bg-black relative">
      <div class="absolute top-0 left-0 right-0 z-10 flex items-center justify-between px-4 py-3 bg-gradient-to-b from-black/70 to-transparent text-white">
        <button data-act="modalKapat" class="text-xl" aria-label="Kapat">✕</button>
        <span class="font-bold">Reels</span>
        <button data-act="reelsEkle" class="text-xl" aria-label="Ekle">＋</button>
      </div>
      <div class="h-full overflow-y-auto snap-y snap-mandatory">${icerik}</div>
    </div>`);
  document.querySelectorAll('.sekme').forEach(b => b.setAttribute('aria-current', String(b.dataset.act === 'reelsAc')));
  $('#modal').style.bottom = '84px';
}

function reelsDosyaIsle(f) {
  const max = 40 * 1024 * 1024;
  if (f.size > max) { toast("Dosya çok büyük (en fazla 40 MB)"); return; }
  if (sb && st.kullanici) { reelYukleDosya(f); return; }
  const tip = f.type.indexOf("video") === 0 ? "video" : "image";
  const girdi = document.getElementById("gonderiMetin");
  const metin = girdi ? girdi.value.trim().slice(0, 150) : "";
  st.reels.unshift({tip, url: URL.createObjectURL(f), metin, yazar: "Sen"});
  toast("Reels'e eklendi 🎬 (bu cihazda)");
  reelsAc();
}

function ayarMesaj(t, hata) {
  const m = document.getElementById("ayarMesaj");
  if (!m) return;
  m.textContent = t;
  m.className = "text-xs text-center min-h-[1rem] " + (hata ? "text-rose-400" : "text-emerald-400");
}

async function ayarKaydet() {
  const ad = document.getElementById("ayarAd").value.trim();
  const yas = parseInt(document.getElementById("ayarYas").value, 10);
  const bio = document.getElementById("ayarBio").value.trim().slice(0, 150);
  const web = webTemizle(document.getElementById("ayarWeb").value);
  const rozet = document.getElementById("ayarRozet").value;
  if (!ad) return ayarMesaj("Adınızı yazın.", true);
  if (!(yas >= 18 && yas <= 99)) return ayarMesaj("Yaş 18 ile 99 arasında olmalı.", true);
  if (sb && st.kullanici) {
    const {error} = await sb.auth.updateUser({data: {ad, yas, bio}});
    if (error) return ayarMesaj(hataMetni(error), true);
    const {error: pe} = await sb.from("profiles").update({web, rozet}).eq("id", st.kullanici.id);
    if (pe) return ayarMesaj("Kaydedilemedi: " + pe.message, true);
  }
  BEN.ad = ad;
  BEN.yas = yas;
  BEN.bio = bio;
  BEN.web = web;
  BEN.rozet = rozet;
  if (st.kullanici) st.kullanici.ad = ad;
  modalKapat();
  toast("Profilin güncellendi ✅");
  profilDbKaydet();
  render();
}

async function gizlilikKaydet() {
  const gizlilik = document.getElementById("ayarGizlilik").value === "takipci" ? "takipci" : "herkes";
  const vBegeni = document.getElementById("ayarBegeniGizli").value === "1";
  const vYorum = document.getElementById("ayarYorumKapali").value === "1";
  const m = document.getElementById("gizlilikMesaj");
  const hata = (t) => { if (m) { m.textContent = t; m.className = "text-xs text-center min-h-[1rem] text-rose-400"; } };
  if (sb && st.kullanici) {
    const {error: pe} = await sb.from("profiles").update({gizlilik, varsayilan_begeni_gizli: vBegeni, varsayilan_yorum_kapali: vYorum}).eq("id", st.kullanici.id);
    if (pe) return hata("Kaydedilemedi: " + pe.message);
    const {error} = await sb.auth.updateUser({data: {gizlilik}});
    if (error) return hata(hataMetni(error));
  }
  st.gizlilik = gizlilik;
  st.vBegeniGizli = vBegeni;
  st.vYorumKapali = vYorum;
  try { localStorage.setItem("vm_gizlilik", gizlilik); } catch (err) {}
  toast("Gizlilik tercihleri kaydedildi ✅");
  render();
}

    case 'hlKapat': hlKapat(); break;
    case 'ayarlar': st.sekme = 'ayarlar'; render(); break;
    case 'profilDuzenle': profilDuzenleAc(); break;
    case 'gizlilikKaydet': gizlilikKaydet(); break;
    case 'ayarKaydet': ayarKaydet(); break;
    case 'cal': st.calan = !st.calan; render(); break;
    case 'parca': st.parca = +d.i; st.ilerleme = 0; st.calan = true; render(); break;
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'mesajGiris' && st.sohbetId != null) gonder(st.sohbetId);
  if (e.target.id && e.target.id.indexOf('yorum-') === 0) yorumGonder(e.target.id.slice(6));
  if (e.target.id === 'grupGiris' && st.grupAcik != null) grupGonder(st.grupAcik);
  if (e.target.id === 'aramaGiris') aramaYap();
  if (e.target.id === 'dbMesajGiris') dbMesajGonder();
  if (e.target.id === 'ypMetin') ypGonder();
  if (e.target.id === 'notGiris') {
    const b = document.querySelector('[data-act="notKaydet"]');
    if (b) b.click();
  }
});

/* ---------- Başlatma ---------- */
try { st.benFoto = localStorage.getItem('vm_foto') || null; } catch (err) {}
try { st.gizlilik = localStorage.getItem('vm_gizlilik') === 'takipci' ? 'takipci' : st.gizlilik; } catch (err) {}
try { st.bildirimler = JSON.parse(localStorage.getItem('vm_bildirim') || '[]') || []; } catch (err) {}
try { st.gruplar = JSON.parse(localStorage.getItem('vm_gruplar') || '[]') || []; } catch (err) {}
try { st.sarki = JSON.parse(localStorage.getItem('vm_sarki') || 'null'); } catch (err) {}
try { st.tema = localStorage.getItem('vm_tema') === 'acik' ? 'acik' : 'koyu'; } catch (err) {}
temaUygula();
try {
  const kayitli = JSON.parse(localStorage.getItem('vm_not') || 'null');
  if (kayitli && Date.now() - kayitli.t < 864e5) st.not = kayitli;
} catch (err) {}

try { st.engelli = okuListe("vm_engel").map(Number); } catch (err) { st.engelli = []; }
try { st.dil = localStorage.getItem("vm_dil") || "tr"; } catch (err) { st.dil = "tr"; }
st.gonderiler.forEach(g => { g.yorumlar = g.yorumlar || []; });
st.gonderiler[0].yorumlar.push({ad: "Elif", metin: "Harika fotoğraf!", zaman: "10 dk önce"});
st.gonderiler[1].yorumlar.push({ad: "Mert", metin: "Ben de geliyorum ☕", zaman: "30 dk önce"});
desteOlustur();
render();

setInterval(async () => {
  if (st.dbSohbetAcik == null || st.sekme !== 'mesajlar') return;
  await dbSohbetYukle(st.dbSohbetAcik);
  const kutu = document.getElementById('dbMesajKutu');
  if (kutu) kutu.innerHTML = dbBalonlar();
}, 8000);

setInterval(() => { if (sb && st.kullanici) bildirimYukle(); }, 30000);
setInterval(() => { if (sb && st.kullanici) hikayeYukle(); }, 60000);

/* Müzik oynatıcı ilerlemesi (prototip: sahte ilerleme) */
setInterval(() => {
  if (!st.calan || st.sekme !== 'profil') return;
  st.ilerleme += 1.2;
  if (st.ilerleme >= 100) {
    st.ilerleme = 0;
    st.parca = (st.parca + 1) % SARKILAR.length;
    render();
    return;
  }
  const i = $('#ilerleme');
  if (i) i.style.width = st.ilerleme + '%';
}, 500);

</script>
